/* ===== стекло: ровное везде, перелив только на вкладке Po ===== */
:root{--sheen:none;--glass-flat:rgba(255,255,255,.80);--soft-flat:rgba(255,255,255,.62)}
@media (prefers-color-scheme:dark){:root{--glass-flat:rgba(38,34,48,.82);--soft-flat:rgba(255,255,255,.08)}}
.po-scope{--sheen:radial-gradient(140% 90% at 0% -10%,var(--spec),transparent 46%),linear-gradient(150deg,var(--glass-hi),var(--glass) 55%,var(--glass-hi));--glass-flat:var(--glass);--soft-flat:var(--glass-hi)}
.glass,.bg-card{background-image:var(--sheen);background-color:var(--glass-flat);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:0 0 0 1px var(--line),inset 0 0 0 1px var(--glass-edge),inset 0 2px 1px var(--hl),var(--glass-shadow)}
.glass-strong{background-image:var(--sheen);background-color:var(--glass-flat);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:0 0 0 1px var(--line),inset 0 0 0 1px var(--glass-edge),inset 0 2px 1px var(--hl),0 22px 54px -20px rgba(60,20,90,.5)}
.glass-lite,.bg-soft{background-image:var(--sheen);background-color:var(--soft-flat);box-shadow:0 0 0 1px var(--line),inset 0 0 0 1px var(--glass-edge),inset 0 1.5px 1px var(--hl)}
.seg-on{background:var(--po)!important;color:#fff!important;box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 8px 16px -8px rgba(255,0,85,.7)}
.field{background:var(--soft-flat);box-shadow:inset 0 0 0 1px var(--line),inset 0 2px 4px rgba(60,20,80,.06)}
.bg-po{background:var(--po)}
.text-grad{color:var(--po);font-weight:800}
.btn-po{color:#fff;background:var(--po);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.4),0 10px 20px -10px rgba(255,0,85,.7)}
.bubble-me{background:var(--po);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.4),0 8px 18px -10px rgba(255,0,85,.7)}
.po-orb{width:76px;height:76px;border-radius:28px;display:grid;place-items:center;flex-shrink:0;background-image:var(--sheen);background-color:var(--glass-hi);box-shadow:inset 0 0 0 1px var(--glass-edge),inset 0 2px 1px var(--hl),0 14px 30px -12px rgba(139,92,246,.45)}
.po-bg{position:fixed;inset:0;z-index:-1;background:var(--bg-grad);animation:fade .5s ease-out}
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;animation:fade .5s ease-out}
.ambient i{position:absolute;border-radius:50%;opacity:var(--orb,1);will-change:transform}
.ambient i:nth-child(1){width:80vmax;height:80vmax;left:-30vmax;top:-34vmax;background:radial-gradient(circle,rgba(255,0,85,.55),transparent 62%);animation:orb1 26s ease-in-out infinite}
.ambient i:nth-child(2){width:72vmax;height:72vmax;right:-28vmax;top:2vmax;background:radial-gradient(circle,rgba(124,92,255,.52),transparent 62%);animation:orb2 32s ease-in-out infinite}
.ambient i:nth-child(3){width:76vmax;height:76vmax;left:-16vmax;bottom:-40vmax;background:radial-gradient(circle,rgba(56,189,248,.48),transparent 62%);animation:orb1 38s ease-in-out infinite reverse}
.ambient i:nth-child(4){width:50vmax;height:50vmax;right:2vmax;bottom:2vmax;background:radial-gradient(circle,rgba(255,184,0,.42),transparent 62%);animation:orb2 30s ease-in-out infinite reverse}
.ambient i:nth-child(5){width:44vmax;height:44vmax;left:30vmax;top:30vmax;background:radial-gradient(circle,rgba(255,120,200,.34),transparent 62%);animation:orb1 44s ease-in-out infinite}
@keyframes orb1{50%{transform:translate(10vmax,8vmax) scale(1.1)}}
@keyframes orb2{50%{transform:translate(-9vmax,10vmax) scale(.92)}}
@media (max-width:767px){.ambient i{animation:none;will-change:auto}}
/* анимации переходов */
.page{animation:pageIn .46s cubic-bezier(.2,.85,.25,1) backwards}
.page[data-dir="1"]{--dx:34px}.page[data-dir="-1"]{--dx:-34px}
@keyframes pageIn{from{opacity:0;transform:translate3d(var(--dx,0px),16px,0) scale(.985)}}
.stagger>*{animation:rise .55s cubic-bezier(.2,.85,.25,1) backwards}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}}
.tab-pop{display:inline-flex;animation:tabPop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes tabPop{0%{transform:scale(.7) translateY(4px)}60%{transform:scale(1.22) translateY(-3px)}100%{transform:none}}
.pane-in{animation:paneIn .34s cubic-bezier(.2,.85,.25,1) backwards}
@keyframes paneIn{from{opacity:0;transform:translateX(40px)}}
.dlg-in{animation:dlgIn .26s cubic-bezier(.2,.9,.3,1.25)}
@keyframes dlgIn{from{opacity:0;transform:scale(.9) translateY(12px)}}
/* видео */
.vglass{background:rgba(18,16,22,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);color:#fff}
.vshadow{text-shadow:0 1px 8px rgba(0,0,0,.75)}
.burst{animation:burst .8s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.25)}70%{opacity:1;transform:scale(1) translateY(-14px)}100%{opacity:0;transform:scale(1.1) translateY(-60px)}}
button{transition:transform .18s ease,filter .2s ease}
button:active{transform:scale(.96)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.glass-strong,.bg-card{background-color:var(--card)}}

/* стили постов-лимиток: непрозрачные, видны всем */
.post.ps-winter,.ps-winter .post{background:#0c2038;box-shadow:inset 0 0 0 1.5px #2f6a9c,0 14px 30px -16px rgba(0,0,0,.6)}
.post.ps-frozen,.ps-frozen .post{background:#102a40;box-shadow:inset 0 0 0 1.5px #67d4e8,0 14px 30px -16px rgba(0,0,0,.6)}
.post.ps-halloween,.ps-halloween .post{background:#1d0f24;box-shadow:inset 0 0 0 1.5px #ff6b00,0 14px 30px -16px rgba(0,0,0,.6)}
.post.ps-cursed,.ps-cursed .post{background:#2a0707;box-shadow:inset 0 0 0 1.5px #dc2626,0 14px 30px -16px rgba(0,0,0,.6)}
.post.ps-winter,.post.ps-frozen,.post.ps-halloween,.post.ps-cursed{-webkit-backdrop-filter:none;backdrop-filter:none}
/* shop rarity */
.r-common{border-color:#94a3b8}.r-rare{border-color:#3b82f6}.r-epic{border-color:#a855f7;box-shadow:0 0 14px rgba(168,85,247,.35)}
.r-legendary{border-color:#f59e0b;box-shadow:0 0 18px rgba(245,158,11,.4)}.r-mythic{border-color:#ef4444;box-shadow:0 0 22px rgba(239,68,68,.45)}

/* advent */
.adv{aspect-ratio:1/1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;position:relative;transition:transform .15s}
.adv:active{transform:scale(.95)}.adv.lock{opacity:.4}.adv.open{background:linear-gradient(135deg,#dff3ff,#9fd8f5);color:#0a2540}
.adv.today{box-shadow:0 0 0 3px #4FC3F7,0 0 22px rgba(79,195,247,.6)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
