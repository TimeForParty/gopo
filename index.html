                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    let w=img.width, h=img.height;
                    if(w>h){if(w>maxSize){h=Math.round(h*maxSize/w);w=maxSize}}else{if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize}}

                };

                img.src = e.target.result;
            };

            Comment: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>,
            Info: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>,
            Eye: ({className}) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
            Wind: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>,
            Mic: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>,
            Play: ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Pause: ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
            Next: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17" y="4" width="3" height="16"/></svg>,
            Prev: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><rect x="4" y="4" width="3" height="16"/></svg>,
            Crown: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2 6l4 12h12l4-12-7 5-3-7-3 7z"/></svg>,
            Group: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Heart: ({filled}) => <svg width="18" height="18" viewBox="0 0 24 24" fill={filled?'currentColor':'none'} stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
            Upload: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
        };

        const SplashScreen = () => (
            <div className="flex h-screen w-full bg-gopo items-center justify-center overflow-hidden">
                <div className="splash-bubble"><span>GoPo</span></div>
            </div>
        );

        const Avatar = memo(({ src, name, size=40, isOnline, showStatus=false, halloweenFrame }) => {
            const inner = src ? <img src={src} alt="" className="rounded-full object-cover" style={{width:size, height:size}} /> : <div className="rounded-full bg-gopo text-white flex items-center justify-center font-black" style={{width:size, height:size, fontSize:size*0.4}}>{(name||'?')[0].toUpperCase()}</div>;
            const frameColor = halloweenFrame === 'frame_orange' ? '#FF8C00' : halloweenFrame === 'frame_purple' ? '#8B5CF6' : halloweenFrame === 'frame_green' ? '#22C55E' : halloweenFrame === 'frame_red' ? '#EF4444' : null;
            const wrapped = frameColor
                ? <div style={{ padding: 3, borderRadius: '50%', display: 'inline-block', background: `linear-gradient(135deg, ${frameColor}, #FFB800)`, boxShadow: `0 0 12px ${frameColor}80` }}>{inner}</div>
                : inner;
            if (!showStatus) return <div className="flex-shrink-0">{wrapped}</div>;
            const dot = Math.max(10, Math.round(size*0.28));
            const extra = frameColor ? 6 : 0;
            return (<div className="relative flex-shrink-0" style={{width:size+extra, height:size+extra}}>{wrapped}<span className={`absolute bottom-0 right-0 rounded-full border-2 border-white shadow-sm ${isOnline?'bg-green-500':'bg-slate-300'}`} style={{width:dot, height:dot}} /></div>);
        });

        const TypingDots = ({ className="" }) => (<span className={`inline-flex items-center space-x-1 ${className}`}><span className="typing-dot"></span><span className="typing-dot"></span><span className="typing-dot"></span></span>);
        const Logo = ({ small }) => <div className={`gopo-logo gopo-logo-halloween ${small?'scale-75 origin-left':''}`}><span>GoPo</span></div>;

        const HalloweenBats = () => (
            <div className="fixed inset-0 pointer-events-none z-[1] overflow-hidden">
                <div className="absolute text-3xl opacity-25" style={{top:'12%', animation:'flyBat 22s linear infinite'}}>🦇</div>
                <div className="absolute text-2xl opacity-20" style={{top:'42%', animation:'flyBat 28s linear infinite', animationDelay:'-8s'}}>🦇</div>
                <div className="absolute text-xl opacity-25" style={{top:'72%', animation:'flyBat 19s linear infinite', animationDelay:'-12s'}}>🦇</div>
            </div>
        );

        // ===== CLICKER TAB =====
        const ClickerTab = ({ user, profile }) => {
            const [candies, setCandies] = useState(profile.halloweenCandies || 0);
            const [view, setView] = useState('tap');
            const [pulse, setPulse] = useState(false);
            const [floats, setFloats] = useState([]);
            const [now, setNow] = useState(Date.now());
            const pendingRef = useRef(0);
            const saveTimerRef = useRef(null);

            useEffect(() => { setCandies(profile.halloweenCandies || 0); }, [profile.halloweenCandies]);
            useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);

            const isActive = now < HALLOWEEN_END;
            const owned = profile.halloweenOwned || [];
            const activeFrame = profile.halloweenFrameId || null;
            const activeBadge = profile.halloweenBadgeId || null;
            const activePost = !!profile.halloweenPostStyle;

            const flush = () => {
                if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); saveTimerRef.current = null; }
                const amt = pendingRef.current;
                if (amt === 0) return;
                pendingRef.current = 0;
                db.collection('users').doc(user.uid).update({ halloweenCandies: firebase.firestore.FieldValue.increment(amt) }).catch(() => {});
            };

            const tap = (e) => {
                if (!isActive) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX || (e.touches && e.touches[0]?.clientX) || (rect.left + rect.width / 2);
                const y = e.clientY || (e.touches && e.touches[0]?.clientY) || (rect.top + rect.height / 2);
                setCandies(c => c + 1);
                pendingRef.current += 1;
                setPulse(true);
                setTimeout(() => setPulse(false), 100);
                const fid = Date.now() + Math.random();
                setFloats(f => [...f, { id: fid, x, y }]);
                setTimeout(() => setFloats(f => f.filter(v => v.id !== fid)), 1000);
                if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                saveTimerRef.current = setTimeout(flush, 2000);
            };

            useEffect(() => () => flush(), []);

            const buy = async (item) => {
                if (!isActive) { alert('Ивент завершён 🎃'); return; }
                if (owned.includes(item.id)) return;
                if (candies < item.price) { alert('Недостаточно конфет 🍬'); return; }
                if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); saveTimerRef.current = null; }
                const addBack = pendingRef.current; pendingRef.current = 0;
                try {
                    await db.collection('users').doc(user.uid).update({
                        halloweenCandies: firebase.firestore.FieldValue.increment(addBack - item.price),
                        halloweenOwned: firebase.firestore.FieldValue.arrayUnion(item.id)
                    });
                } catch (e) { alert(e.message); }
            };

            const equip = async (item) => {
                const updates = {};
                if (item.type === 'frame') updates.halloweenFrameId = activeFrame === item.id ? null : item.id;
                if (item.type === 'badge') updates.halloweenBadgeId = activeBadge === item.id ? null : item.id;
                if (item.type === 'post') updates.halloweenPostStyle = !activePost;
                try { await db.collection('users').doc(user.uid).update(updates); } catch (e) { alert(e.message); }
            };

            const timeLeft = HALLOWEEN_END - now;
            const days = Math.max(0, Math.floor(timeLeft / 86400000));
            const hours = Math.max(0, Math.floor((timeLeft % 86400000) / 3600000));
            const mins = Math.max(0, Math.floor((timeLeft % 3600000) / 60000));

            return (
                <div className="fade-in rounded-3xl min-h-[calc(100vh-140px)] p-5 text-white relative overflow-hidden"
                     style={{ background: 'linear-gradient(135deg, #1a0a1f 0%, #0f0714 50%, #1a0a1f 100%)' }}>
                    <div className="absolute inset-0 pointer-events-none overflow-hidden">
                        <div className="absolute text-3xl opacity-25" style={{top:'8%', animation:'flyBat 20s linear infinite'}}>🦇</div>
                        <div className="absolute text-2xl opacity-20" style={{top:'55%', animation:'flyBat 26s linear infinite', animationDelay:'-7s'}}>🦇</div>
                    </div>

                    <div className="relative z-10">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center gap-2">
                                <span className="text-2xl">🎃</span>
                                <h1 className="text-2xl font-black">Ночь конфет</h1>
                            </div>
                            <div className="flex items-center gap-2 bg-black/50 rounded-full px-4 py-2 border border-orange-500/40">
                                <span className="text-lg">🍬</span>
                                <span className="font-black text-lg text-orange-300">{candies}</span>
                            </div>
                        </div>

                        {isActive ? (
                            <div className="event-pill mb-4">⏰ До конца ивента: {days}д {hours}ч {mins}м</div>
                        ) : (
                            <div className="bg-red-500/20 border border-red-500/40 rounded-full px-4 py-2 text-sm font-bold mb-4 text-red-300 text-center">
                                🎃 Ивент завершён
                            </div>
                        )}

                        <div className="flex gap-1 mb-4 bg-black/50 rounded-2xl p-1 border border-white/10">
                            <button onClick={() => setView('tap')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${view==='tap'?'bg-gradient-to-r from-orange-500 to-purple-600 text-white':'text-slate-400'}`}>🔨 Тапалка</button>
                            <button onClick={() => setView('shop')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${view==='shop'?'bg-gradient-to-r from-orange-500 to-purple-600 text-white':'text-slate-400'}`}>🛒 Магазин</button>
                            <button onClick={() => setView('inv')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${view==='inv'?'bg-gradient-to-r from-orange-500 to-purple-600 text-white':'text-slate-400'}`}>🎒 Инв. ({owned.length})</button>
                        </div>

                        {view === 'tap' && (
                            <div className="flex flex-col items-center justify-center py-6">
                                <div onClick={tap} onTouchStart={tap} className={`clicker-pumpkin ${pulse ? 'pulse' : ''} ${!isActive ? 'opacity-40 cursor-not-allowed' : ''}`}>🎃</div>
                                <p className="text-center text-sm text-slate-400 mt-6 font-bold px-4">
                                    {isActive ? 'Тапай по тыкве, чтобы получать конфеты 🍬' : 'Ивент закончился — тыква спит'}
                                </p>
                                <div className="mt-6 text-center">
                                    <div className="text-5xl font-black text-orange-300">{candies}</div>
                                    <div className="text-xs text-slate-400 font-bold mt-1">🍬 конфет</div>
                                </div>
                            </div>
                        )}

                        {view === 'shop' && (
                            <div className="space-y-2">
                                {SHOP_ITEMS.map(item => {
                                    const has = owned.includes(item.id);
                                    const canAfford = candies >= item.price;
                                    return (
                                        <div key={item.id} className={`bg-black/50 rounded-2xl p-3 border-2 rarity-${item.rarity} flex items-center gap-3`}>
                                            <div className="text-3xl">{item.emoji}</div>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-black text-sm">{item.name}</div>
                                                <div className="text-[10px] text-slate-400 font-bold uppercase">{RARITY_LABEL[item.rarity]} · {item.type === 'frame' ? 'Рамка' : item.type === 'badge' ? 'Бейдж' : 'Стиль постов'}</div>
                                            </div>
                                            <div className="flex flex-col items-end gap-1">
                                                <div className={`text-xs font-bold ${canAfford ? 'text-orange-300' : 'text-slate-500'}`}>🍬 {item.price}</div>
                                                {has ? <span className="text-[10px] font-black text-green-400">✓ Куплено</span>
                                                    : <button onClick={() => buy(item)} disabled={!canAfford || !isActive} className="bg-gradient-to-r from-orange-500 to-purple-600 text-white text-xs font-black px-3 py-1.5 rounded-lg disabled:opacity-40">Купить</button>}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {view === 'inv' && (
                            <div>
                                {owned.length === 0 ? (
                                    <div className="text-center py-16 text-slate-400">
                                        <div className="text-6xl mb-3">🎒</div>
                                        <p className="font-bold">Инвентарь пуст</p>
                                        <p className="text-xs mt-1">Заработай конфеты и купи что-нибудь</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {SHOP_ITEMS.filter(i => owned.includes(i.id)).map(item => {
                                            const isEq = (item.type === 'frame' && activeFrame === item.id) || (item.type === 'badge' && activeBadge === item.id) || (item.type === 'post' && activePost);
                                            return (
                                                <div key={item.id} className={`bg-black/50 rounded-2xl p-3 border-2 rarity-${item.rarity} flex items-center gap-3`}>
                                                    <div className="text-3xl">{item.emoji}</div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="font-black text-sm">{item.name}</div>
                                                        <div className="text-[10px] text-slate-400 font-bold">{isEq ? '✓ Надето' : 'Не надето'}</div>
                                                    </div>
                                                    <button onClick={() => equip(item)} className={`text-xs font-black px-3 py-1.5 rounded-lg ${isEq ? 'bg-slate-700 text-white' : 'bg-gradient-to-r from-orange-500 to-purple-600 text-white'}`}>{isEq ? 'Снять' : 'Надеть'}</button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {floats.map(f => <div key={f.id} className="float-candy" style={{ left: f.x, top: f.y }}>+1 🍬</div>)}
                </div>
            );
        };

        // ===== APP =====
        function App() {
            const [splashDone, setSplashDone] = useState(false);
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [usersMap, setUsersMap] = useState({});
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('feed');
            const [showCreate, setShowCreate] = useState(false);
            const [viewingProfile, setViewingProfile] = useState(null);
            const [viewingPost, setViewingPost] = useState(null);
            const [showNotifications, setShowNotifications] = useState(false);
            const [unreadNotifs, setUnreadNotifs] = useState(0);
            const [searchHashtag, setSearchHashtag] = useState(null);
            const [eventActive, setEventActive] = useState(Date.now() < HALLOWEEN_END);
            const isAdmin = user?.email === 'hvadim439@gmail.com';

            const [playerTrack, setPlayerTrack] = useState(null);
            const [playerQueue, setPlayerQueue] = useState([]);
            const [playerPlaying, setPlayerPlaying] = useState(false);
            const [playerProgress, setPlayerProgress] = useState(0);
            const [playerDuration, setPlayerDuration] = useState(0);
            const playerAudioRef = useRef(null);

            useEffect(() => {
                if (!playerAudioRef.current || !playerTrack) return;
                if (playerPlaying) playerAudioRef.current.play().catch(()=>setPlayerPlaying(false));
                else playerAudioRef.current.pause();
            }, [playerTrack, playerPlaying]);

            useEffect(() => { const t = setInterval(() => setEventActive(Date.now() < HALLOWEEN_END), 60000); return () => clearInterval(t); }, []);

            const playTrack = (track, queue) => {
                if (playerTrack?.id === track.id) { setPlayerPlaying(p => !p); return; }
                setPlayerTrack(track); setPlayerQueue(queue || []); setPlayerProgress(0); setPlayerPlaying(true);
            };
            const nextTrack = () => { if (!playerQueue.length) return; const idx = playerQueue.findIndex(t => t.id === playerTrack?.id); setPlayerTrack(playerQueue[(idx + 1) % playerQueue.length]); setPlayerProgress(0); setPlayerPlaying(true); };
            const prevTrack = () => { if (!playerQueue.length) return; const idx = playerQueue.findIndex(t => t.id === playerTrack?.id); setPlayerTrack(playerQueue[(idx - 1 + playerQueue.length) % playerQueue.length]); setPlayerProgress(0); setPlayerPlaying(true); };

            useEffect(() => { const t = setTimeout(() => setSplashDone(true), 2000); return () => clearTimeout(t); }, []);
            useEffect(() => { if (!auth) return; const unsub = auth.onAuthStateChanged(u => { setUser(u); if(!u){setProfile(null);setLoading(false);} }); return () => unsub(); }, []);
            useEffect(() => { const unsub = db.collection('users').onSnapshot(snap => { const m={}; snap.docs.forEach(d=>{m[d.id]=d.data();}); setUsersMap(m); }); return () => unsub(); }, []);

            useEffect(() => {
                if (!user) return;
                const ref = db.collection('users').doc(user.uid);
                const markOnline = () => ref.update({ isOnline:true, lastActiveAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
                const markOffline = () => ref.update({ isOnline:false, lastSeen: firebase.firestore.FieldValue.serverTimestamp(), typingIn:null }).catch(()=>{});
                markOnline();
                const vis = () => document.hidden ? markOffline() : markOnline();
                document.addEventListener('visibilitychange', vis);
                window.addEventListener('beforeunload', markOffline);
                const hb = setInterval(() => { if(!document.hidden) markOnline(); }, 60000);
                return () => { document.removeEventListener('visibilitychange', vis); window.removeEventListener('beforeunload', markOffline); clearInterval(hb); markOffline(); };
            }, [user]);

            useEffect(() => {
                if (!user) return;
                const unsub = db.collection('users').doc(user.uid).onSnapshot(async (doc) => {
                    if (doc.exists) { setProfile(doc.data()); setLoading(false); }
                    else if (user.displayName) {
                        const np = { uid:user.uid, email:user.email, username: user.displayName.toLowerCase().replace(/[^a-z0-9_]/g,''), displayName:user.displayName, avatar:null, banner:'', bio:'', isVerified: user.email === 'hvadim439@gmail.com', isBanned:false, followers:[], following:[], isOnline:true, lastSeen:null, lastActiveAt:null, typingIn:null, typingAt:null, showTypingFeed:true, savedTracks:[], halloweenCandies:0, halloweenOwned:[], halloweenFrameId:null, halloweenBadgeId:null, halloweenPostStyle:false, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
                        await db.collection('users').doc(user.uid).set(np);
                        setProfile(np); setLoading(false);
                    }
                }, err => { console.error('profile:', err); setLoading(false); });
                return () => unsub();
            }, [user]);

            useEffect(() => {
                if (!user) return;
                const unsub = db.collection('notifications').where('recipientId','==',user.uid).where('read','==',false).onSnapshot(snap => setUnreadNotifs(snap.size));
                return () => unsub();
            }, [user]);

            if (!splashDone) return <SplashScreen />;
            if (loading || !auth) return <div className="h-screen flex items-center justify-center bg-slate-50"><div className="loader"></div></div>;
            if (!user) return <AuthScreen />;
            if (!profile) return <div className="h-screen flex items-center justify-center bg-slate-50"><div className="loader"></div></div>;

            if (profile.isBanned) return (
                <div className="h-screen flex items-center justify-center p-6 text-center">
                    <div className="liquid-glass p-10 rounded-3xl">
                        <div className="text-red-500 text-6xl mb-4">⛔</div>
                        <h1 className="text-2xl font-black mb-2">Аккаунт заблокирован</h1>
                        <p className="text-slate-500 mb-6">Обратитесь к администрации GoPo.</p>
                        <button onClick={()=>auth.signOut()} className="bg-gopo text-white font-bold px-6 py-3 rounded-xl">Выйти</button>
                    </div>
                </div>
            );

            const goToHashtag = (tag) => { setActiveTab('search'); setSearchHashtag(tag); };

            return (
                <div className={`flex h-screen relative overflow-hidden ${eventActive ? 'halloween-tint bg-[#f0f2f5]' : 'bg-[#f0f2f5]'}`}>
                    {eventActive && <HalloweenBats />}
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} isAdmin={isAdmin} onCreate={()=>setShowCreate(true)} onOpenNotifs={()=>setShowNotifications(true)} unread={unreadNotifs} />
                    <main className={`flex-1 overflow-y-auto p-4 md:p-8 relative ${playerTrack ? 'pb-56 md:pb-40' : 'pb-24 md:pb-8'}`}>
                        <div className="max-w-2xl mx-auto">
                            <MobileMenuButton isAdmin={isAdmin} setActiveTab={setActiveTab} />
                            {eventActive && activeTab !== 'clicker' && (
                                <button onClick={()=>setActiveTab('clicker')} className="event-pill mb-3 w-full">
                                    🎃 Хэллоуин-ивент · Кликай и получай конфеты · до 10.11.26 12:00 МСК
                                </button>
                            )}

                        {image && <div className="relative mt-3"><img src={image} className="rounded-2xl max-h-64 w-full object-cover" /><button onClick={()=>setImage(null)} className="absolute top-2 right-2 bg-black/60 text-white p-1.5 rounded-full"><I.X/></button></div>}
                        <div className="flex items-center justify-between mt-4 pt-4 border-t">
                            <button onClick={()=>fileRef.current.click()} className="flex items-center space-x-2 text-slate-500 hover:text-gopo font-bold p-2"><I.Image/><span>Фото</span></button>
                            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handle} />
                            <button onClick={submit} disabled={posting || (!text.trim() && !image)} className="bg-gopo text-white font-bold px-6 py-2.5 rounded-2xl disabled:opacity-50 shadow-md shadow-pink-200">{posting?'Публикация...':'Запустить пузырь'}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const MessengerTab = ({ user, profile, usersMap }) => {
            const [query, setQuery] = useState('');
            const [selectedUser, setSelectedUser] = useState(null);
            const [selectedGroup, setSelectedGroup] = useState(null);
            const [view, setView] = useState('users');
            const [groups, setGroups] = useState([]);
            const [showCreateGroup, setShowCreateGroup] = useState(false);
            const [, tick] = useState(0);
            useEffect(() => { const t = setInterval(()=>tick(x=>x+1), 10000); return () => clearInterval(t); }, []);
            useEffect(() => {
                const unsub = db.collection('groups').where('members','array-contains',user.uid).onSnapshot(snap => {
                    const arr = snap.docs.map(d => ({id:d.id, ...d.data()}));
                    arr.sort((a,b) => (b.lastMessageAt?.toDate?.()?.getTime()||0) - (a.lastMessageAt?.toDate?.()?.getTime()||0));
                    setGroups(arr);
                });
                return () => unsub();
            }, [user.uid]);
            const allUsers = Object.values(usersMap).filter(u => u.uid !== user.uid && !u.isBanned);
            const filteredUsers = allUsers.filter(u => (u.username||'').toLowerCase().includes(query.toLowerCase()) || (u.displayName||'').toLowerCase().includes(query.toLowerCase()));
            const filteredGroups = groups.filter(g => (g.name||'').toLowerCase().includes(query.toLowerCase()));
            return (
                <div className="flex h-[calc(100vh-100px)] md:h-[calc(100vh-64px)] liquid-glass rounded-3xl overflow-hidden fade-in">
                    <div className={`w-full md:w-80 flex flex-col border-r border-white/50 ${(selectedUser||selectedGroup)?'hidden md:flex':'flex'}`}>
                        <div className="p-4 border-b border-white/50 bg-white/30">
                            <div className="flex items-center justify-between mb-3">
                                <h2 className="text-xl font-black">Чаты</h2>
                                <button onClick={()=>setShowCreateGroup(true)} className="bg-gopo text-white p-2 rounded-xl shadow-md" title="Новая группа"><I.Group/></button>
                            </div>
                            <div className="flex space-x-1 mb-3 bg-white/50 p-1 rounded-xl">
                                <button onClick={()=>setView('users')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold ${view==='users'?'bg-gopo text-white':'text-slate-600'}`}>Личные</button>
                                <button onClick={()=>setView('groups')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold ${view==='groups'?'bg-gopo text-white':'text-slate-600'}`}>Группы ({groups.length})</button>
                            </div>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><I.Search/></div>
                                <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Поиск..." className="w-full p-2.5 pl-10 bg-white/70 border border-white/50 rounded-xl outline-none focus:ring-2 focus:ring-gopo text-sm font-medium" />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto">
                            {view==='users' && filteredUsers.map(u => {
                                const typing = isTypingNow(u, user.uid);
                                return (
                                    <button key={u.uid} onClick={()=>setSelectedUser(u)} className={`w-full flex items-center space-x-3 p-3 hover:bg-white/50 transition text-left ${selectedUser?.uid===u.uid?'bg-white/60':''}`}>
                                        <Avatar src={u.avatar} name={u.username} size={44} showStatus isOnline={isReallyOnline(u)} halloweenFrame={u.halloweenFrameId} />
                                        <div className="min-w-0 flex-1">
                                            <div className="flex items-center">
                                                <span className="font-bold text-sm truncate">{u.displayName || u.username}</span>
                                                {u.isVerified && <I.Check className="text-blue-500 ml-1"/>}
                                            </div>
                                            {typing ? (
                                                <p className="text-xs text-gopo font-bold flex items-center">печатает <TypingDots className="ml-1 text-gopo" /></p>
                                            ) : (
                                                <p className={`text-xs truncate ${isReallyOnline(u)?'text-green-600 font-bold':'text-slate-500'}`}>{formatLastSeen(u)}</p>
                                            )}
                                        </div>
                                    </button>
                                );
                            })}
                            {view==='groups' && filteredGroups.map(g => (
                                <button key={g.id} onClick={()=>setSelectedGroup(g)} className={`w-full flex items-center space-x-3 p-3 hover:bg-white/50 transition text-left ${selectedGroup?.id===g.id?'bg-white/60':''}`}>
                                    {g.avatar ? <img src={g.avatar} className="w-11 h-11 rounded-full object-cover" /> : <div className="w-11 h-11 rounded-full bg-gopo text-white flex items-center justify-center font-black">{g.name?.[0]?.toUpperCase()}</div>}
                                    <div className="min-w-0 flex-1">
                                        <span className="font-bold text-sm truncate block">{g.name}</span>
                                        <p className="text-xs text-slate-500">{g.members?.length || 0} участников</p>
                                    </div>
                                </button>
                            ))}
                            {view==='groups' && filteredGroups.length===0 && <p className="text-center text-slate-400 text-xs font-bold p-6">Групп нет. Создай первую!</p>}
                        </div>
                    </div>
                    <div className={`flex-1 flex-col ${(selectedUser||selectedGroup)?'flex':'hidden md:flex'}`}>
                        {selectedUser && <ChatView user={user} profile={profile} other={selectedUser} onBack={()=>setSelectedUser(null)} />}
                        {selectedGroup && <GroupChatView user={user} profile={profile} group={selectedGroup} usersMap={usersMap} onBack={()=>setSelectedGroup(null)} />}
                        {!selectedUser && !selectedGroup && (
                            <div className="flex-1 flex flex-col items-center justify-center text-slate-400"><I.Msg/><p className="mt-4 font-bold">Выберите чат или группу</p></div>
                        )}
                    </div>
                    {showCreateGroup && <CreateGroupModal user={user} profile={profile} usersMap={usersMap} onClose={()=>setShowCreateGroup(false)} />}
                </div>
            );
        };

        const CreateGroupModal = ({ user, profile, usersMap, onClose }) => {
            const [name, setName] = useState('');
            const [avatar, setAvatar] = useState(null);
            const [selected, setSelected] = useState([]);
            const [creating, setCreating] = useState(false);
            const [query, setQuery] = useState('');
            const fileRef = useRef(null);
            const others = Object.values(usersMap).filter(u => u.uid !== user.uid && !u.isBanned);
            const filtered = others.filter(u => (u.username||'').toLowerCase().includes(query.toLowerCase()) || (u.displayName||'').toLowerCase().includes(query.toLowerCase()));
            const toggle = (uid) => setSelected(s => s.includes(uid) ? s.filter(x=>x!==uid) : [...s, uid]);
            const create = async () => {
                if (!name.trim()) { alert('Введите название'); return; }
                if (selected.length === 0) { alert('Выберите хотя бы одного участника'); return; }
                setCreating(true);
                try {
                    await db.collection('groups').add({
                        name: name.trim(), avatar, creatorId: user.uid, admins: [user.uid],
                        members: [user.uid, ...selected],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    selected.forEach(uid => sendNotification(uid, {uid:user.uid, username:profile.username, avatar:profile.avatar}, 'message', `Приглашение в группу "${name}"`));
                    onClose();
                } catch(e) { alert(e.message); }
                setCreating(false);
            };
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-black">Новая группа</h2>
                            <button onClick={onClose} className="p-2 text-slate-400"><I.X/></button>
                        </div>
                        <div className="flex flex-col items-center mb-4">
                            <div onClick={()=>fileRef.current.click()} className="w-24 h-24 rounded-full bg-slate-100 flex items-center justify-center overflow-hidden cursor-pointer hover:bg-slate-200">
                                {avatar ? <img src={avatar} className="w-full h-full object-cover" /> : <div className="text-slate-400 text-center"><I.Group/><p className="text-[10px] font-bold mt-1">Аватар</p></div>}
                            </div>
                            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={async (e)=>{ const f=e.target.files[0]; if(f) setAvatar(await compressImage(f, 300, 0.7)); }} />
                        </div>
                        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Название группы" className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium" />
                        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Поиск участников..." className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium" />
                        <p className="text-xs font-bold text-slate-600 mb-2">Выбрано: {selected.length}</p>
                        <div className="max-h-48 overflow-y-auto mb-4 border border-slate-100 rounded-xl">
                            {filtered.map(u => (
                                <button key={u.uid} onClick={()=>toggle(u.uid)} className={`w-full flex items-center space-x-2 p-2 hover:bg-slate-50 ${selected.includes(u.uid)?'bg-pink-50':''}`}>
                                    <Avatar src={u.avatar} name={u.username} size={32} />
                                    <span className="font-bold text-sm flex-1 text-left truncate">{u.displayName || u.username}</span>
                                    {selected.includes(u.uid) && <span className="text-gopo font-black">✓</span>}
                                </button>
                            ))}
                        </div>
                        <button onClick={create} disabled={creating} className="w-full bg-gopo text-white font-bold py-3 rounded-xl disabled:opacity-50">{creating ? 'Создание...' : 'Создать группу'}</button>
                    </div>
                </div>
            );
        };

        const ChatView = ({ user, profile, other, onBack }) => {
            const [messages, setMessages] = useState([]);
            const [text, setText] = useState('');
            const [otherUser, setOtherUser] = useState(other);
            const [showEmojiPicker, setShowEmojiPicker] = useState(null);
            const [playingId, setPlayingId] = useState(null);
            const participants = [user.uid, other.uid].sort();
            const endRef = useRef(null);
            const typingThrottle = useRef(0);
            const typingClear = useRef(null);
            const audioRefs = useRef({});
            const prevLen = useRef(0);
            const [, tick] = useState(0);
            useEffect(() => { const t = setInterval(()=>tick(x=>x+1), 5000); return () => clearInterval(t); }, []);
            useEffect(() => { const unsub = db.collection('users').doc(other.uid).onSnapshot(doc => { if (doc.exists) setOtherUser(doc.data()); }); return () => unsub(); }, [other.uid]);
            useEffect(() => {
                const unsub = db.collection('messages').where('participants','==',participants).onSnapshot(snap => {
                    const arr = snap.docs.map(d => ({id:d.id, reactions:{}, readBy:[], ...d.data()}));
                    arr.sort((a,b) => (a.createdAt?.toDate?.()?.getTime()||0) - (b.createdAt?.toDate?.()?.getTime()||0));
                    setMessages(arr);
                    if (arr.length > prevLen.current) {
                        prevLen.current = arr.length;
                        setTimeout(() => endRef.current?.scrollIntoView({behavior:'smooth', block:'end'}), 80);
                    }
                    arr.filter(m => m.senderId === other.uid && !(m.readBy||[]).includes(user.uid))
                       .forEach(m => db.collection('messages').doc(m.id).update({readBy: firebase.firestore.FieldValue.arrayUnion(user.uid)}).catch(()=>{}));
                });
                return () => unsub();
            }, [participants.join(',')]);
            useEffect(() => () => { db.collection('users').doc(user.uid).update({typingIn:null}).catch(()=>{}); clearTimeout(typingClear.current); }, [user.uid]);
            const delMsg = async (id) => { if (!window.confirm('Удалить сообщение?')) return; await db.collection('messages').doc(id).delete(); };
            const toggleReaction = async (msg, emoji) => {
                const cur = msg.reactions || {}; const users = cur[emoji] || []; const has = users.includes(user.uid);
                const nr = {...cur};
                if (has) { nr[emoji] = users.filter(u => u !== user.uid); if (nr[emoji].length === 0) delete nr[emoji]; }
                else nr[emoji] = [...users, user.uid];
                await db.collection('messages').doc(msg.id).update({reactions:nr});
                setShowEmojiPicker(null);
            };
            const handleChange = (val) => {
                setText(val);
                const ref = db.collection('users').doc(user.uid);
                if (!val.trim()) { ref.update({typingIn:null}).catch(()=>{}); clearTimeout(typingClear.current); return; }
                const now = Date.now();
                if (now - typingThrottle.current > 2000) { typingThrottle.current = now; ref.update({typingIn:other.uid, typingAt: firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{}); }
                clearTimeout(typingClear.current);
                typingClear.current = setTimeout(()=>ref.update({typingIn:null}).catch(()=>{}), 3000);
            };
            const send = async (e) => {
                e.preventDefault(); if (!text.trim()) return;
                await db.collection('messages').add({ participants, text: text.trim(), senderId: user.uid, readBy: [user.uid], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                if (other.uid !== user.uid) sendNotification(other.uid, {uid:user.uid, username:profile.username, avatar:profile.avatar}, 'message', text.trim().slice(0,60));
                setText('');
                db.collection('users').doc(user.uid).update({typingIn:null}).catch(()=>{});
                clearTimeout(typingClear.current);
            };
            const playAudio = (msg) => {
                if (playingId === msg.id) { audioRefs.current[msg.id]?.pause(); setPlayingId(null); return; }
                Object.values(audioRefs.current).forEach(a => a?.pause());
                const a = new Audio(msg.audio); audioRefs.current[msg.id] = a; a.onended = () => setPlayingId(null); a.play(); setPlayingId(msg.id);
            };
            const isOtherTyping = isTypingNow(otherUser, user.uid);
            const isOtherOnline = isReallyOnline(otherUser);
            return (
                <div className="flex-1 flex flex-col h-full bg-white/40">
                    <div className="p-3 border-b border-white/50 flex items-center space-x-3 bg-white/50 backdrop-blur-md">
                        <button onClick={onBack} className="p-2 text-slate-600 hover:bg-white rounded-full md:hidden"><I.Back/></button>
                        <Avatar src={otherUser.avatar} name={otherUser.username} size={40} showStatus isOnline={isOtherOnline} halloweenFrame={otherUser.halloweenFrameId} />
                        <div className="flex-1 min-w-0">
                            <div className="flex items-center">
                                <span className="font-black text-sm truncate">{otherUser.displayName || otherUser.username}</span>
                                {otherUser.isVerified && <I.Check className="text-blue-500 ml-1"/>}
                                {otherUser.halloweenBadgeId && <span className="ml-1">{getItemById(otherUser.halloweenBadgeId)?.emoji}</span>}
                            </div>
                            {isOtherTyping ? <p className="text-xs text-gopo font-bold flex items-center">печатает <TypingDots className="ml-1 text-gopo" /></p>
                                : <p className={`text-xs font-bold ${isOtherOnline?'text-green-600':'text-slate-500'}`}>{formatLastSeen(otherUser)}</p>}
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-2">
                        {messages.length===0 && <p className="text-center text-slate-400 font-bold mt-10 text-sm">Начните диалог 👋</p>}
                        {messages.map(m => {
                            const mine = m.senderId === user.uid;
                            const reactions = m.reactions || {};
                            const wf = waveBars(m.id);
                            return (
                                <div key={m.id} className={`flex flex-col ${mine?'items-end':'items-start'} group`}>
                                    <div className={`flex items-center ${mine?'flex-row':'flex-row-reverse'} space-x-1`}>
                                        <div className="flex items-center space-x-1">
                                            {mine && <button onClick={()=>delMsg(m.id)} className="p-1.5 rounded-full text-slate-300 hover:text-red-500 hover:bg-red-50 opacity-0 group-hover:opacity-100"><I.Trash size={14}/></button>}
                                            <button onClick={()=>setShowEmojiPicker(showEmojiPicker===m.id?null:m.id)} className="p-1.5 rounded-full text-slate-300 hover:text-gopo opacity-0 group-hover:opacity-100 text-sm">😊</button>
                                        </div>
                                        <div className={`max-w-[75%] px-4 py-2.5 rounded-2xl text-sm font-medium shadow-sm ${mine?'bg-gopo text-white rounded-br-sm':'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'}`}>
                                            {m.audio ? (
                                                <button onClick={()=>playAudio(m)} className="flex items-center space-x-2">
                                                    {playingId===m.id ? <I.Pause size={16}/> : <I.Play size={16}/>}
                                                    <div className="flex items-end space-x-0.5 h-5">{wf.map((h,i)=><span key={i} className={`w-0.5 ${mine?'bg-white':'bg-slate-600'}`} style={{height:`${h}%`}}></span>)}</div>
                                                    <span className="text-xs opacity-70">{m.audioDuration}s</span>
                                                </button>
                                            ) : m.text}
                                            {mine && <span className="inline-block ml-1 text-[10px] align-middle">{(m.readBy||[]).includes(other.uid)?'✓✓':'✓'}</span>}
                                        </div>
                                    </div>
                                    {Object.keys(reactions).length > 0 && (
                                        <div className="flex space-x-1 mt-1">
                                            {Object.entries(reactions).map(([emoji, users]) => users.length > 0 && (
                                                <button key={emoji} onClick={()=>toggleReaction(m, emoji)} className={`px-2 py-0.5 rounded-full text-xs font-bold flex items-center space-x-1 ${users.includes(user.uid)?'bg-gopo/15 text-gopo':'bg-white border border-slate-200 text-slate-600'}`}>
                                                    <span>{emoji}</span><span>{users.length}</span>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                    {showEmojiPicker === m.id && (
                                        <div className="mt-1 bg-white border border-slate-200 rounded-full shadow-lg px-2 py-1 flex space-x-1 z-10">
                                            {EMOJI_REACTIONS.map(e => <button key={e} onClick={()=>toggleReaction(m, e)} className="p-1.5 text-lg hover:scale-125 transition">{e}</button>)}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                        <div ref={endRef} />
                    </div>
                    <form onSubmit={send} className="p-3 border-t border-white/50 flex gap-2 bg-white/50 items-center">
                        <input value={text} onChange={e=>handleChange(e.target.value)} placeholder="Сообщение..." className="flex-1 p-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-gopo font-medium" />
                        <button type="submit" disabled={!text.trim()} className="bg-gopo text-white p-3 rounded-xl shadow-md disabled:opacity-50"><I.Send/></button>
                    </form>
                </div>
            );
        };

        const GroupChatView = ({ user, profile, group, usersMap, onBack }) => {
            const [messages, setMessages] = useState([]);
            const [text, setText] = useState('');
            const [liveGroup, setLiveGroup] = useState(group);
            const endRef = useRef(null);
            const prevLen = useRef(0);
            useEffect(() => { const unsub = db.collection('groups').doc(group.id).onSnapshot(d => { if(d.exists) setLiveGroup(d.data()); }); return () => unsub(); }, [group.id]);
            useEffect(() => {
                const unsub = db.collection('groups').doc(group.id).collection('messages').onSnapshot(snap => {
                    const arr = snap.docs.map(d => ({id:d.id, ...d.data()}));
                    arr.sort((a,b) => (a.createdAt?.toDate?.()?.getTime()||0) - (b.createdAt?.toDate?.()?.getTime()||0));
                    setMessages(arr);
                    if (arr.length > prevLen.current) { prevLen.current = arr.length; setTimeout(() => endRef.current?.scrollIntoView({behavior:'smooth', block:'end'}), 80); }
                });
                return () => unsub();
            }, [group.id]);
            const send = async (e) => {
                e.preventDefault(); if (!text.trim()) return;
                await db.collection('groups').doc(group.id).collection('messages').add({ senderId: user.uid, senderName: profile.username, senderAvatar: profile.avatar, text: text.trim(), createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection('groups').doc(group.id).update({lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()});
                setText('');
            };
            const delMsg = async (m) => {
                if (m.senderId !== user.uid && !(liveGroup.admins||[]).includes(user.uid)) return;
                if (!window.confirm('Удалить?')) return;
                await db.collection('groups').doc(group.id).collection('messages').doc(m.id).delete();
            };
            const leave = async () => { if (!window.confirm('Выйти из группы?')) return; await db.collection('groups').doc(group.id).update({members: firebase.firestore.FieldValue.arrayRemove(user.uid)}); onBack(); };
            const isAdmin = (liveGroup.admins||[]).includes(user.uid);
            return (
                <div className="flex-1 flex flex-col h-full bg-white/40">
                    <div className="p-3 border-b border-white/50 flex items-center space-x-3 bg-white/50 backdrop-blur-md">
                        <button onClick={onBack} className="p-2 text-slate-600 hover:bg-white rounded-full md:hidden"><I.Back/></button>
                        {liveGroup.avatar ? <img src={liveGroup.avatar} className="w-10 h-10 rounded-full object-cover" /> : <div className="w-10 h-10 rounded-full bg-gopo text-white flex items-center justify-center font-black">{liveGroup.name?.[0]?.toUpperCase()}</div>}
                        <div className="flex-1 min-w-0">
                            <span className="font-black text-sm truncate block">{liveGroup.name}</span>
                            <p className="text-xs text-slate-500">{liveGroup.members?.length || 0} участников{isAdmin ? ' • вы админ' : ''}</p>
                        </div>
                        <button onClick={leave} className="text-xs font-bold text-red-500 px-3 py-1 rounded-lg hover:bg-red-50">Выйти</button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-2">
                        {messages.length===0 && <p className="text-center text-slate-400 font-bold mt-10 text-sm">Начните общение 👋</p>}
                        {messages.map(m => {
                            const mine = m.senderId === user.uid;
                            return (
                                <div key={m.id} className={`flex flex-col ${mine?'items-end':'items-start'} group`}>
                                    <div className={`flex ${mine?'flex-row':'flex-row-reverse'} items-end space-x-1.5`}>
                                        {!mine && <Avatar src={m.senderAvatar} name={m.senderName} size={28} />}
                                        <div className={`max-w-[75%] px-3 py-2 rounded-2xl text-sm font-medium shadow-sm ${mine?'bg-gopo text-white rounded-br-sm':'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'}`}>

        const ProfileTab = ({ user, profile, usersMap }) => {

            const [saving, setSaving] = useState(false);
            const [userPosts, setUserPosts] = useState([]);
            const bannerRef = useRef(null);
            useEffect(() => {
                const unsub = db.collection('posts').where('authorId','==',user.uid).onSnapshot(s => {
                    const arr = s.docs.map(d => ({id:d.id, ...d.data()}));
                    arr.sort((a,b) => postTime(b) - postTime(a));
                    setUserPosts(arr);
                });
                return () => unsub();
            }, [user.uid]);
            const upload = async (e, setter, max) => { const f = e.target.files[0]; if (!f) return; setter(await compressImage(f, max, 0.7)); };
            const deletePost = async (id) => { if (!window.confirm('Удалить пузырь навсегда?')) return; try { await db.collection('posts').doc(id).delete(); } catch(err) { alert('Не удалось: ' + err.message); } };
            const save = async () => {
                setSaving(true);
                try {
                    const uname = username.trim().replace(/[^a-zA-Z0-9_]/g,'').toLowerCase();
                    if (!uname) { alert('Никнейм не может быть пустым'); setSaving(false); return; }
                    if (uname !== profile.username) {
                        const dup = await db.collection('users').where('username','==',uname).limit(1).get();
                        if (!dup.empty) { alert('Этот никнейм уже занят'); setSaving(false); return; }
                    }
                    await db.collection('users').doc(user.uid).update({ displayName: name.trim() || uname, username: uname, bio: bio.trim(), avatar, banner: banner || '' });
                    setEditing(false);
                } catch(err) { alert(err.message); }
                setSaving(false);
            };
            const badge = profile.halloweenBadgeId ? getItemById(profile.halloweenBadgeId) : null;
            return (
                <div className="fade-in max-w-xl mx-auto">
                    <div className="bg-white rounded-[2.5rem] overflow-hidden border border-slate-100 shadow-sm mb-6">

                            {!profile.banner && <div className="absolute inset-0 bg-gradient-to-br from-gopo to-pink-400"></div>}
                        </div>
                        <div className="px-6 pb-6 relative">
                            <div className="-mt-14 mb-3 inline-block p-1 bg-white rounded-full shadow-lg">
                                <Avatar src={profile.avatar} name={profile.username} size={100} showStatus isOnline={isReallyOnline(profile)} halloweenFrame={profile.halloweenFrameId} />
                            </div>
                            <div className="flex items-start justify-between">
                                <div>
                                    <div className="flex items-center">
                                        <h1 className="text-2xl font-black mr-2">{profile.displayName || profile.username}</h1>
                                        {profile.isVerified && <I.Check className="text-blue-500"/>}
                                        {badge && <span className="ml-1 text-xl" title={badge.name}>{badge.emoji}</span>}
                                    </div>
                                    <p className="text-slate-500 font-medium">@{profile.username}</p>
                                    <p className={`text-xs font-bold mt-1 ${isReallyOnline(profile)?'text-green-600':'text-slate-400'}`}>{formatLastSeen(profile)}</p>
                                    {profile.bio && <p className="text-slate-700 mt-2 text-sm">{profile.bio}</p>}
                                    {profile.halloweenCandies > 0 && <p className="text-xs font-black text-orange-500 mt-1">🍬 {profile.halloweenCandies} конфет</p>}
                                </div>
                                <button onClick={()=>setEditing(true)} className="border-2 border-slate-200 hover:border-slate-300 font-bold px-4 py-2 rounded-xl text-sm transition">Изменить</button>
                            </div>
                            <div className="flex space-x-6 mt-5 pt-5 border-t border-slate-100">
                                <div><span className="font-black text-lg">{userPosts.length}</span> <span className="text-slate-500 text-sm font-medium">пузырей</span></div>
                                <div><span className="font-black text-lg">{profile.followers?.length||0}</span> <span className="text-slate-500 text-sm font-medium">подписчиков</span></div>
                                <div><span className="font-black text-lg">{profile.following?.length||0}</span> <span className="text-slate-500 text-sm font-medium">подписок</span></div>
                            </div>
                        </div>
                    </div>
                    <h3 className="font-black text-lg mb-3 ml-2">Мои пузыри</h3>
                    <div className="space-y-4">
                        {userPosts.map(post => {
                            const mood = MOODS[post.mood] || MOODS.neutral;
                            return (
                                <div key={post.id} className={`relative rounded-[2rem] p-4 border-2 ${mood.bg} ${mood.border} ${profile.halloweenPostStyle?'post-halloween-style':''}`}>
                                    <button onClick={()=>deletePost(post.id)} className="absolute top-3 right-3 p-2 rounded-full bg-white/70 text-slate-400 hover:text-red-500 backdrop-blur-sm shadow-sm z-10"><I.Trash/></button>
                                    <div className="flex items-center justify-between mb-2 pr-10">
                                        <p className={`text-[10px] opacity-70 ${mood.text}`}>{timeAgo(post.createdAt)}</p>
                                        <span className="text-xl">{mood.emoji}</span>
                                    </div>
                                    {post.text && <p className={`text-sm mb-2 ${mood.text}`}>{post.text}</p>}
                                    {post.image && <img src={post.image} className="rounded-xl max-h-60 w-full object-cover shadow-sm" />}
                                </div>
                            );
                        })}
                        {userPosts.length===0 && <p className="text-center text-slate-400 font-bold text-sm py-8">У вас пока нет пузырей</p>}
                    </div>
                    {editing && (

                                <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-black">Редактировать</h2><button onClick={()=>setEditing(false)} className="p-2"><I.X/></button></div>
                                <div className="mb-4">

                                    <div onClick={()=>bannerRef.current.click()} className="h-24 bg-slate-100 rounded-xl cursor-pointer bg-cover bg-center flex items-center justify-center overflow-hidden" style={{backgroundImage:`url(${banner||''})`}}>

                                        <input type="file" accept="image/*" className="hidden" onChange={e=>upload(e, setAvatar, 200)} />

                                <label className="text-xs font-bold text-slate-600 ml-1">Имя</label>
                                <input value={name} onChange={e=>setName(e.target.value)} className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium" />

                                <input value={username} onChange={e=>setUsername(e.target.value.replace(/[^a-zA-Z0-9_]/g,''))} className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium" />
                                <label className="text-xs font-bold text-slate-600 ml-1">О себе</label>
                                <textarea value={bio} onChange={e=>setBio(e.target.value)} className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-4 font-medium resize-none h-20" />
                                <button onClick={save} disabled={saving} className="w-full bg-gopo text-white font-bold py-3 rounded-xl disabled:opacity-50">{saving?'Сохранение...':'Сохранить'}</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const UserProfileModal = ({ targetUser, currentUser, currentProfile, onClose }) => {
            const [targetPosts, setTargetPosts] = useState([]);
            const [liveUser, setLiveUser] = useState(targetUser);
            const isSelf = targetUser.uid === currentUser.uid;
            const isFollowing = currentProfile.following?.includes(targetUser.uid);
            useEffect(() => {
                const unsubU = db.collection('users').doc(targetUser.uid).onSnapshot(d => { if (d.exists) setLiveUser(d.data()); });
                const unsub = db.collection('posts').where('authorId','==',targetUser.uid).onSnapshot(s => {
                    const arr = s.docs.map(d => ({id:d.id, ...d.data()}));
                    arr.sort((a,b) => postTime(b) - postTime(a));
                    setTargetPosts(arr);
                });
                return () => { unsubU(); unsub(); };
            }, [targetUser.uid]);
            const toggleFollow = async () => {
                const myRef = db.collection('users').doc(currentUser.uid);
                const targetRef = db.collection('users').doc(targetUser.uid);
                if (isFollowing) {
                    await myRef.update({following: firebase.firestore.FieldValue.arrayRemove(targetUser.uid)});
                    await targetRef.update({followers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)});
                } else {
                    await myRef.update({following: firebase.firestore.FieldValue.arrayUnion(targetUser.uid)});
                    await targetRef.update({followers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});
                    sendNotification(targetUser.uid, {uid:currentUser.uid, username:currentProfile.username, avatar:currentProfile.avatar}, 'follow', '');
                }
            };
            const badge = liveUser?.halloweenBadgeId ? getItemById(liveUser.halloweenBadgeId) : null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-[2.5rem] w-full max-w-lg max-h-[90vh] overflow-y-auto relative fade-in">
                        <button onClick={onClose} className="absolute top-4 right-4 z-10 bg-black/40 text-white p-2 rounded-full hover:bg-black/60"><I.X/></button>
                        <div className="h-40 bg-slate-200 relative bg-cover bg-center rounded-t-[2.5rem]" style={{backgroundImage:`url(${liveUser.banner||''})`}}>
                            {!liveUser.banner && <div className="absolute inset-0 bg-gradient-to-br from-gopo to-pink-400 rounded-t-[2.5rem]"></div>}
                        </div>
                        <div className="px-6 pb-6 relative">
                            <div className="-mt-14 mb-3 inline-block p-1 bg-white rounded-full shadow-lg">
                                <Avatar src={liveUser.avatar} name={liveUser.username} size={100} showStatus isOnline={isReallyOnline(liveUser)} halloweenFrame={liveUser.halloweenFrameId} />
                            </div>
                            <div className="flex items-start justify-between">
                                <div>
                                    <div className="flex items-center">
                                        <h1 className="text-2xl font-black mr-2">{liveUser.displayName || liveUser.username}</h1>
                                        {liveUser.isVerified && <I.Check className="text-blue-500"/>}
                                        {badge && <span className="ml-1 text-xl" title={badge.name}>{badge.emoji}</span>}
                                    </div>
                                    <p className="text-slate-500 font-medium">@{liveUser.username}</p>
                                    <p className={`text-xs font-bold mt-1 ${isReallyOnline(liveUser)?'text-green-600':'text-slate-400'}`}>{formatLastSeen(liveUser)}</p>
                                    {liveUser.bio && <p className="text-slate-700 mt-2 text-sm">{liveUser.bio}</p>}
                                    {liveUser.halloweenCandies > 0 && <p className="text-xs font-black text-orange-500 mt-1">🍬 {liveUser.halloweenCandies} конфет</p>}
                                </div>

                                    <button onClick={toggleFollow} className={`font-bold px-6 py-2 rounded-xl text-sm transition ${isFollowing?'bg-slate-100 text-slate-600 hover:bg-red-50 hover:text-red-500':'bg-gopo text-white shadow-md'}`}>
                                        {isFollowing?'Отписаться':'Подписаться'}

                                )}
                            </div>
                            <div className="flex space-x-6 mt-5 pt-5 border-t border-slate-100">
                                <div><span className="font-black text-lg">{targetPosts.length}</span> <span className="text-slate-500 text-sm font-medium">пузырей</span></div>
                                <div><span className="font-black text-lg">{liveUser.followers?.length||0}</span> <span className="text-slate-500 text-sm font-medium">подписчиков</span></div>

                        <div className="px-4 pb-6 space-y-3 bg-slate-50">

                                            <p className={`text-xs opacity-70 ${mood.text}`}>{timeAgo(post.createdAt)}</p>
                                            <span className="text-xl">{mood.emoji}</span>
                                        </div>
                                        {post.text && <p className={`text-sm mb-2 ${mood.text}`}>{post.text}</p>}
                                        {post.image && <img src={post.image} className="rounded-xl max-h-60 w-full object-cover shadow-sm" />}
                                    </div>
                                );
                            })}
                            {targetPosts.length===0 && <p className="text-center text-slate-400 font-bold text-sm py-4">Пузырей нет</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminTab = ({ user, usersMap }) => {
            const users = Object.values(usersMap);
            const me = usersMap[user.uid];
            const showTyping = me?.showTypingFeed !== false;
            const [adminTab, setAdminTab] = useState('users');
            const [pendingTracks, setPendingTracks] = useState([]);
            const [playingId, setPlayingId] = useState(null);
            const [rejectingTrack, setRejectingTrack] = useState(null);
            const [rejectReason, setRejectReason] = useState('');
            const audioRefs = useRef({});
            const [, tick] = useState(0);
            useEffect(() => { const t = setInterval(()=>tick(x=>x+1), 5000); return () => clearInterval(t); }, []);

            useEffect(() => {
                const unsub = db.collection('tracks').onSnapshot(snap => {
                    const arr = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(t => t.status === 'pending');
                    arr.sort((a,b) => (a.createdAt?.toDate?.()?.getTime()||0) - (b.createdAt?.toDate?.()?.getTime()||0));
                    setPendingTracks(arr);
                });
                return () => unsub();
            }, []);

            const toggleVerify = async (id, cur) => await db.collection('users').doc(id).update({isVerified:!cur});
            const toggleBan = async (id, cur) => { if (window.confirm(cur?'Разбанить?':'Забанить?')) await db.collection('users').doc(id).update({isBanned:!cur}); };
            const toggleTyping = async () => await db.collection('users').doc(user.uid).update({showTypingFeed:!showTyping});

            const playTrackPreview = (t) => {
                if (playingId === t.id) { audioRefs.current[t.id]?.pause(); setPlayingId(null); return; }
                Object.values(audioRefs.current).forEach(a => a?.pause());
                const a = new Audio(t.audioUrl);
                audioRefs.current[t.id] = a;
                a.onended = () => setPlayingId(null);
                a.play().catch(()=>{});
                setPlayingId(t.id);
            };

            const approveTrack = async (t) => {
                await db.collection('tracks').doc(t.id).update({
                    status: 'approved', rejectionReason: '',
                    moderatedBy: user.uid,
                    moderatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                sendNotification(t.uploadedBy, {uid:user.uid, username:'admin', avatar:null}, 'music_approved', `Трек «${t.title}» опубликован`, {trackId: t.id});
            };

            const confirmReject = async () => {
                if (!rejectingTrack) return;
                if (!rejectReason.trim()) { alert('Укажите причину'); return; }
                await db.collection('tracks').doc(rejectingTrack.id).update({
                    status: 'rejected',
                    rejectionReason: rejectReason.trim(),
                    moderatedBy: user.uid,
                    moderatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                sendNotification(rejectingTrack.uploadedBy, {uid:user.uid, username:'admin', avatar:null}, 'music_rejected', rejectReason.trim(), {trackId: rejectingTrack.id});
                setRejectingTrack(null);
                setRejectReason('');
            };

            const typingUsers = users.filter(u => { if (!u.typingIn) return false; if (!u.typingAt) return true; try { return (Date.now()-u.typingAt.toDate().getTime()) < 6000; } catch { return true; } });
            const onlineCount = users.filter(u => isReallyOnline(u)).length;

            return (
                <div className="fade-in space-y-6">
                    <div className="flex items-center space-x-2 text-red-500"><I.Shield/><h1 className="text-2xl font-black">Админ-панель</h1></div>
                    <div className="flex space-x-2 bg-white rounded-2xl p-1 shadow-sm">
                        <button onClick={()=>setAdminTab('users')} className={`flex-1 py-2 rounded-xl text-sm font-bold ${adminTab==='users'?'bg-gopo text-white':'text-slate-600'}`}>Пользователи</button>
                        <button onClick={()=>setAdminTab('music')} className={`flex-1 py-2 rounded-xl text-sm font-bold relative ${adminTab==='music'?'bg-gopo text-white':'text-slate-600'}`}>
                            Модерация музыки
                            {pendingTracks.length > 0 && <span className={`ml-1 text-[10px] font-black px-1.5 py-0.5 rounded-full ${adminTab==='music'?'bg-white text-gopo':'bg-gopo text-white'}`}>{pendingTracks.length}</span>}
                        </button>
                    </div>

                    {adminTab === 'users' && (
                        <>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-white/80 rounded-2xl p-4 border border-white/50 shadow-sm"><p className="text-xs font-bold text-slate-500 uppercase">Всего</p><p className="text-2xl font-black text-slate-800">{users.length}</p></div>
                                <div className="bg-green-50 rounded-2xl p-4 border border-green-200 shadow-sm"><p className="text-xs font-bold text-green-700 uppercase">Онлайн</p><p className="text-2xl font-black text-green-800">{onlineCount}</p></div>
                            </div>
                            <div className={`rounded-2xl p-4 border-2 transition ${showTyping?'bg-purple-50 border-purple-200':'bg-slate-50 border-slate-200'}`}>
                                <div className="flex items-center justify-between">
                                    <div className="flex-1 min-w-0">
                                        <p className="font-black text-sm text-slate-800 flex items-center"><I.Eye className="mr-2 text-purple-500" />Трекинг печатающих</p>
                                        <p className="text-xs text-slate-500 font-medium mt-1">{showTyping?'Показывать, кто и кому печатает':'Скрыто'}</p>
                                    </div>
                                    <button onClick={toggleTyping} className={`relative w-12 h-6 rounded-full transition ${showTyping?'bg-purple-500':'bg-slate-300'}`}>
                                        <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ${showTyping?'left-6':'left-0.5'}`}></span>
                                    </button>
                                </div>
                                {showTyping && (
                                    <div className="mt-3 pt-3 border-t border-purple-200">
                                        <p className="text-[10px] font-bold text-purple-700 uppercase mb-2">Сейчас печатают:</p>
                                        {typingUsers.length===0 ? <p className="text-xs text-slate-400 font-bold italic">Никто не печатает</p> : (
                                            <div className="space-y-2">
                                                {typingUsers.map(u => { const target = usersMap[u.typingIn]; return (
                                                    <div key={u.uid} className="flex items-center space-x-2 bg-white/80 rounded-xl p-2">
                                                        <Avatar src={u.avatar} name={u.username} size={28} />
                                                        <p className="text-xs font-bold text-slate-800 truncate flex-1">@{u.username} <span className="text-slate-400 font-medium">→</span> {target?`@${target.username}`:'...'}</p>
                                                        <TypingDots className="text-purple-500" />
                                                    </div>
                                                ); })}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                            <div>
                                <p className="text-slate-500 text-sm font-medium mb-3">Управление пользователями</p>
                                <div className="liquid-glass rounded-3xl overflow-hidden shadow-sm">
                                    {users.map(u => {
                                        const online = isReallyOnline(u);
                                        return (
                                            <div key={u.uid} className={`p-4 border-b border-white/50 last:border-0 ${u.isBanned?'bg-red-50/50':''}`}>
                                                <div className="flex items-center space-x-3 mb-2">
                                                    <Avatar src={u.avatar} name={u.username} size={42} showStatus isOnline={online} halloweenFrame={u.halloweenFrameId} />
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center">
                                                            <span className="font-black text-sm truncate">{u.displayName || u.username}</span>
