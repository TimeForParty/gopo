            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    let w=img.width, h=img.height;
                    if(w>h){if(w>maxSize){h=Math.round(h*maxSize/w);w=maxSize}}else{if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize}}
                    c.width=w; c.height=h;
                    c.getContext('2d').drawImage(img,0,0,w,h);
                    res(c.toDataURL('image/jpeg', quality));
                };
                img.onerror = rej;
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

            const [unreadNotifs, setUnreadNotifs] = useState(0);
            const [searchHashtag, setSearchHashtag] = useState(null);
            const [eventActive, setEventActive] = useState(Date.now() < WINTER_END);
            const [notifPermission, setNotifPermission] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'default');
            const [inviteGroup, setInviteGroup] = useState(null);
            const isAdmin = user?.email === ADMIN_EMAIL;
            const [newVersion, setNewVersion] = useState(false);
            const [reconnectKey, setReconnectKey] = useState(0);
            const hiddenAtRef = useRef(null);

            const [playerTrack, setPlayerTrack] = useState(null);
            const [playerQueue, setPlayerQueue] = useState([]);
            const [playerPlaying, setPlayerPlaying] = useState(false);
            const [playerProgress, setPlayerProgress] = useState(0);
            const [playerDuration, setPlayerDuration] = useState(0);
            const playerAudioRef = useRef(null);

            const unreadMsgs = Object.values(profile?.unreadCounts || {}).reduce((a, b) => a + (b || 0), 0) + Object.values(profile?.unreadGroupCounts || {}).reduce((a, b) => a + (b || 0), 0);
            const totalBadge = unreadNotifs + unreadMsgs;
            const now = Date.now();
            const adventAvailable = now >= ADVENT_START && now <= ADVENT_END;
            const adventFinished = now > ADVENT_END;

            useEffect(() => {
                if (!playerAudioRef.current || !playerTrack) return;
                if (playerPlaying) playerAudioRef.current.play().catch(()=>setPlayerPlaying(false));
                else playerAudioRef.current.pause();
            }, [playerTrack, playerPlaying]);

            useEffect(() => { const t = setInterval(() => setEventActive(Date.now() < WINTER_END), 60000); return () => clearInterval(t); }, []);

            useEffect(() => {
                if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
                if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(e => console.warn('sw register:', e));
            }, []);

            useEffect(() => {
                const check = async () => {
                    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
                    try {
                        const r = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' });
                        if (r.ok) { const j = await r.json(); if (j.version && j.version !== APP_VERSION) setNewVersion(true); }
                    } catch {}
                };
                check();
                const t = setInterval(check, 5 * 60 * 1000);
                return () => clearInterval(t);
            }, []);

            useEffect(() => {
                const handle = () => {
                    if (document.visibilityState === 'visible') {
                        try { db.enableNetwork(); } catch {}
                        if (hiddenAtRef.current && Date.now() - hiddenAtRef.current > 5 * 60 * 1000) setReconnectKey(k => k + 1);
                        hiddenAtRef.current = null;
                    } else {
                        hiddenAtRef.current = Date.now();
                    }
                };
                document.addEventListener('visibilitychange', handle);
                return () => document.removeEventListener('visibilitychange', handle);
            }, []);

            useEffect(() => {
                if (!user || !profile) return;
                if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
                if (typeof firebase === 'undefined' || !firebase.messaging) return;
                let messaging, unsub;
                try { messaging = firebase.messaging(); } catch { return; }
                (async () => {
                    try {
                        if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
                        const token = await messaging.getToken({ vapidKey: FCM_VAPID_KEY });
                        if (token) {
                            await db.collection('users').doc(user.uid)
                                .update({ fcmTokens: firebase.firestore.FieldValue.arrayUnion(token) })
                                .catch(() => {});
                        }
                        unsub = messaging.onMessage(p =>
                            showBrowserNotif({ senderName: 'GoPo', type: 'fcm', text: p.notification?.body || '' })
                        );
                    } catch (e) { console.warn('FCM', e); }
                })();
                return () => { try { unsub && unsub(); } catch {} };
            }, [user, profile, notifPermission]);

            useEffect(() => {
                if (!user) return;
                const tick = async () => {
                    if (document.hidden) return;
                    try {
                        const doc = await db.collection('users').doc(user.uid).get();
                        if (!doc.exists) return;
                        const p = doc.data();
                        const last = p.lastPassiveAt?.toDate?.()?.getTime?.() || 0;
                        if (Date.now() - last >= PASSIVE_INTERVAL_MS) {
                            await db.collection('users').doc(user.uid).update({
                                goCoins: firebase.firestore.FieldValue.increment(PASSIVE_REWARD),
                                lastPassiveAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    } catch {}
                };
                tick();
                const t = setInterval(tick, 60 * 1000);
                return () => clearInterval(t);
            }, [user]);

            const playTrack = (track, queue) => {
                if (playerTrack?.id === track.id) { setPlayerPlaying(p => !p); return; }
                setPlayerTrack(track); setPlayerQueue(queue || []); setPlayerProgress(0); setPlayerPlaying(true);
            };
            const nextTrack = () => { if (!playerQueue.length) return; const idx = playerQueue.findIndex(t => t.id === playerTrack?.id); setPlayerTrack(playerQueue[(idx + 1) % playerQueue.length]); setPlayerProgress(0); setPlayerPlaying(true); };
            const prevTrack = () => { if (!playerQueue.length) return; const idx = playerQueue.findIndex(t => t.id === playerTrack?.id); setPlayerTrack(playerQueue[(idx - 1 + playerQueue.length) % playerQueue.length]); setPlayerProgress(0); setPlayerPlaying(true); };

            useEffect(() => { const t = setTimeout(() => setSplashDone(true), 2000); return () => clearTimeout(t); }, []);
            useEffect(() => { if (!auth) return; const unsub = auth.onAuthStateChanged(u => { setUser(u); if(!u){setProfile(null);setLoading(false);} }); return () => unsub(); }, []);
            useEffect(() => { const unsub = db.collection('users').onSnapshot(snap => { const m={}; snap.docs.forEach(d=>{m[d.id]=d.data();}); setUsersMap(m); }); return () => unsub(); }, []);

            useEffect(() => {
                if (!user) return;
                const ref = db.collection('users').doc(user.uid);
                const markOnline = () => ref.update({ isOnline:true, lastActiveAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
                const markOffline = () => ref.update({ isOnline:false, lastSeen: firebase.firestore.FieldValue.serverTimestamp(), typingIn:null }).catch(()=>{});
                markOnline();
                const vis = () => document.hidden ? markOffline() : markOnline();
                document.addEventListener('visibilitychange', vis);
                window.addEventListener('beforeunload', markOffline);
                const hb = setInterval(() => { if(!document.hidden) markOnline(); }, 60000);
                return () => { document.removeEventListener('visibilitychange', vis); window.removeEventListener('beforeunload', markOffline); clearInterval(hb); markOffline(); };
            }, [user]);

            useEffect(() => {
                if (!user) return;
                const unsub = db.collection('users').doc(user.uid).onSnapshot(async (doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (!data.ownedCosmetics && Array.isArray(data.halloweenOwned) && data.halloweenOwned.length > 0) {
                            db.collection('users').doc(user.uid).update({ ownedCosmetics: data.halloweenOwned }).catch(()=>{});
                        }
                        setProfile(data); setLoading(false);
                    }
                    else if (user.displayName && !window.__gopoRegistering) {
                        const np = {
                            uid:user.uid, email:user.email, username: user.displayName.toLowerCase().replace(/[^a-z0-9_]/g,''), displayName:user.displayName,
                            avatar:null, banner:'', bio:'', isVerified: user.email === ADMIN_EMAIL, isBanned:false,
                            followers:[], following:[], isOnline:true, lastSeen:null, lastActiveAt:null,
                            typingIn:null, typingAt:null, showTypingFeed:true, savedTracks:[],
                            goCoins: 0, ownedCosmetics: [], lastPassiveAt: null,
                            adventOpened: [], adventRewards: {},
                            halloweenFrameId:null, halloweenBadgeId:null, halloweenPostStyle:null,
                            unreadCounts:{}, unreadGroupCounts:{},
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        await db.collection('users').doc(user.uid).set(np);
                        setProfile(np); setLoading(false);
                    }
                }, err => { console.error('profile:', err); setLoading(false); });
                return () => unsub();
            }, [user]);

            useEffect(() => {
                if (!user) return;
                const unsub = db.collection('notifications').where('recipientId','==',user.uid).where('read','==',false).onSnapshot(snap => {
                    snap.docChanges().forEach(change => {
                        if (change.type === 'added' && !change.doc.metadata.hasPendingWrites) {
                            const n = change.doc.data();
                            const nWithId = { id: change.doc.id, ...n };
                            showBrowserNotif(nWithId);
                        }
                    });
                    setUnreadNotifs(snap.size);
                }, err => console.error('notifs listen:', err));
                return () => unsub();
            }, [user]);

            useEffect(() => {
                const params = new URLSearchParams(location.search);
                const inv = params.get('invite');
                if (inv) setInviteGroup(inv);
            }, []);

            useEffect(() => {
                if (!inviteGroup || !user || !profile) return;
                (async () => {
                    try {
                        const gDoc = await db.collection('groups').doc(inviteGroup).get();
                        if (!gDoc.exists) { alert('Группа не найдена'); setInviteGroup(null); history.replaceState(null, '', location.pathname); return; }
                        const g = gDoc.data();
                        if ((g.members || []).includes(user.uid)) {
                            setActiveTab('dm'); setInviteGroup(null); history.replaceState(null, '', location.pathname); return;
                        }
                        if (!confirm(`Вступить в группу «${g.name}»?`)) { setInviteGroup(null); history.replaceState(null, '', location.pathname); return; }
                        await db.collection('groups').doc(inviteGroup).update({ members: firebase.firestore.FieldValue.arrayUnion(user.uid) });
                        await sendNotification(g.creatorId, {uid:user.uid, username:profile.username, avatar:profile.avatar}, 'group_invite', `@${profile.username} вступил(а) в «${g.name}»`, { groupId: inviteGroup });
                        setActiveTab('dm');
                        alert('Вы вступили в группу!');
                        setInviteGroup(null);
                        history.replaceState(null, '', location.pathname);
                    } catch(e) { alert('Ошибка: ' + e.message); setInviteGroup(null); }
                })();
            }, [inviteGroup, user, profile]);

            const requestNotifPerm = async () => {
                if (!('Notification' in window)) { alert('Уведомления не поддерживаются'); return; }
                try {
                    const p = await Notification.requestPermission();
                    setNotifPermission(p);
                    if (p === 'granted') await showBrowserNotif({ senderName: 'GoPo', type: 'welcome', text: 'Уведомления включены' });
                    else if (p === 'denied') alert('Уведомления заблокированы. Открой настройки браузера и разреши уведомления');
                } catch(e) { alert('Ошибка: ' + e.message); }
            };

            if (!splashDone) return <SplashScreen />;
            if (loading || !auth) return <div className="h-screen flex items-center justify-center bg-slate-50"><div className="loader"></div></div>;
            if (!user) return <AuthScreen />;
            if (!profile) return <div className="h-screen flex items-center justify-center bg-slate-50"><div className="loader"></div></div>;

            if (profile.isBanned) return (
                <div className="h-screen flex items-center justify-center p-6 text-center">
                    <div className="liquid-glass p-10 rounded-3xl">
                        <div className="text-red-500 text-6xl mb-4">⛔</div>
                        <h1 className="text-2xl font-black mb-2">Аккаунт заблокирован</h1>
                        <p className="text-slate-500 mb-6">Обратитесь к администрации GoPo.</p>
                        <button onClick={()=>auth.signOut()} className="bg-gopo text-white font-bold px-6 py-3 rounded-xl">Выйти</button>
                    </div>
                </div>
            );

            const goToHashtag = (tag) => { setActiveTab('search'); setSearchHashtag(tag); };
            const showVerifyBanner = user && !user.emailVerified && user.email !== ADMIN_EMAIL;
            const showNotifBanner = notifPermission !== 'granted';

            return (
                <div className={`flex h-screen relative overflow-hidden ${eventActive ? 'winter-tint bg-[#eef4fb]' : 'bg-[#f0f2f5]'}`}>
                    {newVersion && (
                        <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[100] bg-gopo text-white font-bold px-4 py-2 rounded-full shadow-lg flex items-center gap-2 text-xs">
                            🚀 Доступна новая версия
                            <button onClick={() => location.reload()} className="bg-white text-gopo px-3 py-1 rounded-full font-black">Обновить</button>
                        </div>
                    )}
                    {eventActive && <WinterSnowflakes />}
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} isAdmin={isAdmin} onCreate={()=>setShowCreate(true)} onOpenNotifs={()=>setShowNotifications(true)} unread={totalBadge} unreadMsgs={unreadMsgs} adventAvailable={adventAvailable} />
                    <main className={`flex-1 overflow-y-auto p-4 md:p-8 relative ${playerTrack ? 'pb-56 md:pb-40' : 'pb-24 md:pb-8'}`}>
                        <div className="max-w-2xl mx-auto">
                            <div className="flex items-center justify-between gap-2 mb-3">
                                <MobileMenuButton isAdmin={isAdmin} setActiveTab={setActiveTab} adventAvailable={adventAvailable} />
                                <div className="flex items-center gap-2 ml-auto">
                                    <div className="liquid-glass px-3 py-1.5 rounded-full flex items-center gap-1.5 text-sm font-black text-amber-600">
                                        <I.Coin /><span>{profile.goCoins || 0}</span>
                                    </div>
                                    <button onClick={()=>setShowNotifications(true)} className="md:hidden relative liquid-glass p-2.5 rounded-2xl text-slate-700 active:scale-95 transition">
                                        <I.Bell />
                                        {totalBadge > 0 && <span className="absolute -top-1 -right-1 bg-gopo text-white text-[9px] font-black rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1">{totalBadge > 9 ? '9+' : totalBadge}</span>}
                                    </button>
                                </div>
                            </div>

                            {showVerifyBanner && (
                                <div className="mb-3 bg-amber-50 border border-amber-300 rounded-2xl p-3 flex items-center gap-2 text-xs">
                                    <span className="text-xl">✉️</span>
                                    <div className="flex-1 font-bold text-amber-900">Подтверди {user.email}, чтобы получать важные уведомления</div>
                                    <button onClick={async ()=>{ try{ await user.sendEmailVerification(); alert('Письмо отправлено на '+user.email+'. Проверь папку Спам, если не видишь.'); }catch(e){ alert('Не удалось отправить: '+e.message); } }} className="bg-amber-500 text-white font-bold px-3 py-1.5 rounded-lg text-[11px]">Отправить</button>
                                </div>
                            )}

                            {showNotifBanner && (
                                <div className="mb-3 bg-blue-50 border border-blue-300 rounded-2xl p-3 flex items-center gap-2 text-xs">
                                    <span className="text-xl">🔔</span>
                                    <div className="flex-1 font-bold text-blue-900">Включи уведомления, чтобы не пропускать сообщения</div>
                                    <button onClick={requestNotifPerm} className="bg-blue-500 text-white font-bold px-3 py-1.5 rounded-lg text-[11px]">Включить</button>
                                </div>
                            )}

                            {adventAvailable && activeTab !== 'advent' && (
                                <button onClick={()=>setActiveTab('advent')} className="winter-event-pill mb-3 w-full">❄️ Зимний ивент · Адвент-календарь · 1–31 декабря</button>
                            )}
                            {activeTab==='feed' && <FeedTab key={reconnectKey} user={user} profile={profile} isAdmin={isAdmin} usersMap={usersMap} onUserClick={setViewingProfile} onCommentClick={setViewingPost} onHashtagClick={goToHashtag} />}
                            {activeTab==='search' && <SearchTab user={user} usersMap={usersMap} onUserClick={setViewingProfile} onCommentClick={setViewingPost} onHashtagClick={goToHashtag} initialHashtag={searchHashtag} clearHashtag={()=>setSearchHashtag(null)} />}
                            {activeTab==='dm' && <MessengerTab key={reconnectKey} user={user} profile={profile} usersMap={usersMap} />}
                            {activeTab==='notifications' && <NotificationsTab user={user} onUserClick={setViewingProfile} onOpenPost={setViewingPost} />}
                            {activeTab==='profile' && <ProfileTab user={user} profile={profile} usersMap={usersMap} notifPermission={notifPermission} requestNotifPerm={requestNotifPerm} />}
                            {activeTab==='admin' && isAdmin && <AdminTab user={user} usersMap={usersMap} />}
                            {activeTab==='music' && <MusicTab user={user} profile={profile} playerTrack={playerTrack} playerPlaying={playerPlaying} playTrack={playTrack} />}
                            {activeTab==='shop' && <ShopTab user={user} profile={profile} />}
                            {activeTab==='premium' && <PremiumTab user={user} profile={profile} />}
                            {activeTab==='advent' && <AdventTab user={user} profile={profile} />}
                        </div>
                    </main>
                    <MobileNav activeTab={activeTab} setActiveTab={setActiveTab} isAdmin={isAdmin} onCreate={()=>setShowCreate(true)} unread={totalBadge} unreadMsgs={unreadMsgs} onOpenNotifs={()=>setShowNotifications(true)} />
                    {showCreate && <CreatePostModal user={user} profile={profile} onClose={()=>setShowCreate(false)} />}
                    {viewingProfile && <UserProfileModal targetUser={viewingProfile} currentUser={user} currentProfile={profile} onClose={()=>setViewingProfile(null)} />}
                    {viewingPost && <CommentsModal post={viewingPost} user={user} profile={profile} usersMap={usersMap} isAdmin={isAdmin} onClose={()=>setViewingPost(null)} onHashtagClick={goToHashtag} />}
                    {showNotifications && <NotificationsModal user={user} onClose={()=>setShowNotifications(false)} onUserClick={(u)=>{setShowNotifications(false); setViewingProfile(u);}} />}
                    <audio ref={playerAudioRef} src={playerTrack?.audioUrl} onPlay={()=>setPlayerPlaying(true)} onPause={()=>setPlayerPlaying(false)} onTimeUpdate={()=>{ const a=playerAudioRef.current; if(a?.duration) setPlayerProgress((a.currentTime/a.duration)*100); }} onLoadedMetadata={()=>{ const a=playerAudioRef.current; if(a?.duration) setPlayerDuration(a.duration); }} onEnded={()=>{ nextTrack(); }} />
                    {playerTrack && (
                        <div className="fixed bottom-20 left-3 right-3 md:left-auto md:right-6 md:bottom-6 md:w-96 z-[45] mini-player">
                            <div className="liquid-glass rounded-2xl p-3 shadow-2xl">
                                <div className="flex items-center space-x-3">
                                    {playerTrack.cover ? <img src={playerTrack.cover} className="w-12 h-12 rounded-lg object-cover flex-shrink-0" /> : <div className="w-12 h-12 rounded-lg bg-gopo flex items-center justify-center text-white flex-shrink-0"><I.Music/></div>}
                                    <div className="flex-1 min-w-0"><p className="font-black text-sm truncate">{playerTrack.title}</p><p className="text-xs text-slate-500 truncate">{playerTrack.artist}</p></div>
                                    <button onClick={prevTrack} className="p-2 text-slate-600 hover:text-gopo"><I.Prev/></button>
                                    <button onClick={()=>setPlayerPlaying(p=>!p)} className="p-2.5 bg-gopo text-white rounded-full shadow-md">{playerPlaying ? <I.Pause size={18}/> : <I.Play size={18}/>}</button>
                                    <button onClick={nextTrack} className="p-2 text-slate-600 hover:text-gopo"><I.Next/></button>
                                    <button onClick={()=>{setPlayerPlaying(false); setPlayerTrack(null);}} className="p-2 text-slate-400 hover:text-red-500"><I.X/></button>
                                </div>
                                <input type="range" min="0" max="100" value={playerProgress} onChange={e=>{ const a=playerAudioRef.current; if(a?.duration) a.currentTime=(e.target.value/100)*a.duration; }} className="w-full accent-gopo mt-2 h-1" />
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const AuthScreen = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [username, setUsername] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [sentVerify, setSentVerify] = useState(false);
            const [verifyError, setVerifyError] = useState('');

            const submit = async (e) => {
                e.preventDefault(); setError(''); setLoading(true); setVerifyError('');
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        const uname = username.replace(/[^a-zA-Z0-9_]/g,'').toLowerCase();
                        if (!uname) { setError('Введите никнейм'); setLoading(false); return; }
                        if (uname.length < 2) { setError('Никнейм минимум 2 символа'); setLoading(false); return; }
                        window.__gopoRegistering = true;
                        const cred = await auth.createUserWithEmailAndPassword(email, password);
                        await cred.user.updateProfile({ displayName: name });
                        try { await cred.user.sendEmailVerification(); setSentVerify(true); }
                        catch(ve) { setVerifyError(ve.message || ve.code || 'Не удалось отправить письмо'); }
                        const dup = await db.collection('users').where('username','==',uname).limit(1).get();
                        if (!dup.empty) {
                            await cred.user.delete().catch(()=>{});
                            await auth.signOut().catch(()=>{});
                            window.__gopoRegistering = false;
                            setError('Этот никнейм уже занят'); setLoading(false); return;
                        }
                        await db.collection('users').doc(cred.user.uid).set({
                            uid: cred.user.uid, email, username: uname, displayName: name,
                            avatar:null, banner:'', bio:'',
                            isVerified: email === ADMIN_EMAIL, isBanned:false,
                            followers:[], following:[], isOnline:true, lastSeen:null, lastActiveAt:null,
                            typingIn:null, typingAt:null, showTypingFeed:true, savedTracks:[],
                            goCoins: 0, ownedCosmetics: [], lastPassiveAt: null,
                            adventOpened: [], adventRewards: {},
                            halloweenFrameId:null, halloweenBadgeId:null, halloweenPostStyle:null,
                            unreadCounts:{}, unreadGroupCounts:{},
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        window.__gopoRegistering = false;
                    }
                } catch(err) {
                    window.__gopoRegistering = false;
                    const m = {'auth/email-already-in-use':'Этот email уже занят','auth/wrong-password':'Неверный пароль','auth/user-not-found':'Пользователь не найден','auth/weak-password':'Пароль слишком простой (мин. 6)','auth/invalid-email':'Некорректный email','auth/invalid-credential':'Неверные данные','permission-denied':'Ошибка прав Firestore','auth/operation-not-allowed':'Включите Email/Password в Firebase Console'};
                    setError(m[err.code] || err.message);
                }
                setLoading(false);
            };

            return (
                <div className="h-screen flex items-center justify-center p-4 relative">
                    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1547754980-3df97fed72a8?auto=format&fit=crop&w=1920&q=80')] bg-cover opacity-20 filter blur-xl"></div>
                    <div className="liquid-glass p-8 rounded-3xl w-full max-w-md relative z-10">
                        <div className="flex justify-center mb-8"><Logo /></div>
                        <h2 className="text-2xl font-black text-center mb-6">{isLogin?'Вход в GoPo ❄️':'Создать аккаунт ❄️'}</h2>
                        {sentVerify && <div className="bg-green-100 text-green-700 p-3 rounded-xl mb-4 text-sm font-bold">✉️ Письмо отправлено на {email}. Проверь почту и папку Спам.</div>}
                        {verifyError && <div className="bg-amber-100 text-amber-800 p-3 rounded-xl mb-4 text-xs font-bold">Не удалось отправить письмо: {verifyError}</div>}
                        {error && <div className="bg-red-100 text-red-600 p-3 rounded-xl mb-4 text-sm font-bold">{error}</div>}
                        <form onSubmit={submit} className="space-y-4">
                            {!isLogin && <>
                                <input type="text" placeholder="Ваше имя" value={name} onChange={e=>setName(e.target.value)} className="w-full p-3.5 bg-white/50 border border-white/50 rounded-xl outline-none focus:ring-2 focus:ring-gopo font-medium" required />

                        {ripples.filter(r => r.postId === post.id).map(r => <div key={r.rid} className="absolute w-20 h-20 bg-gopo/30 rounded-full animate-ripple pointer-events-none" style={{left:r.x-40, top:r.y-40}}></div>)}
                        <div className="flex items-center space-x-3 mb-3 pr-12">

                        <div className="relative rounded-2xl">

                                        {(post.poll.options || []).map((opt, idx) => {

                                            const votes = Object.values(votesObj).filter(v => v === idx).length;

            return (

                        <div className="flex items-center text-xs font-bold text-slate-500 bg-white/50 px-3 py-1.5 rounded-full border border-white/50 cursor-help group relative">
                            <I.Info/><span className="ml-1">Что такое Резонанс?</span>
                            <div className="absolute top-full mt-2 right-0 w-64 bg-slate-800 text-white p-3 rounded-xl text-[11px] leading-tight opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity z-50 shadow-xl">Резонанс — вибрация с пузырём. Зажми пузырь на <b>1 секунду</b>, чтобы поддержать автора.</div>

                    <StoriesBar user={user} profile={profile} />
                    {blownCount > 0 && <button onClick={()=>setShowBlown(!showBlown)} className="w-full text-center text-xs font-bold text-slate-500 py-2 hover:text-slate-700">{showBlown ? `Скрыть сдутые (${blownCount})` : `Показать сдутые (${blownCount})`}</button>}
                    {visiblePosts.length === 0 && <div className="text-center p-16 liquid-glass rounded-3xl text-slate-400"><I.Home/><p className="mt-4 font-bold">Постов пока нет.</p></div>}

        const SearchTab = ({ user, usersMap, onUserClick, onCommentClick, onHashtagClick, initialHashtag, clearHashtag }) => {

        const CommentsModal = ({ post, user, profile, usersMap, isAdmin, onClose, onHashtagClick }) => {

            const [text, setText] = useState('');
            const [sending, setSending] = useState(false);

            useEffect(() => {
                const unsub = db.collection('posts').doc(post.id).collection('comments').onSnapshot(snap => {

                    setTimeout(() => endRef.current?.scrollIntoView({behavior:'smooth', block:'nearest'}), 100);
                });
                return () => unsub();
            }, [post.id]);

            const send = async (e) => {
                e.preventDefault(); if (!text.trim()) return;
                setSending(true);
                try {
                    await db.collection('posts').doc(post.id).collection('comments').add({ text: text.trim(), authorId: user.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    await db.collection('posts').doc(post.id).update({commentsCount: firebase.firestore.FieldValue.increment(1)});
                    await addGoCoins(user.uid, 10);
                    if (post.authorId !== user.uid) sendNotification(post.authorId, {uid:user.uid, username:profile.username, avatar:profile.avatar}, 'comment', text.trim().slice(0,60), {postId:post.id});

                    await db.collection('posts').doc(post.id).collection('comments').doc(c.id).delete();

            const fileRef = useRef(null);
            const handle = async (e) => { const f = e.target.files[0]; if (!f) return; setImage(await compressImage(f, 800, 0.7)); };

            const setOpt = (i, val) => setPollOpts(o => o.map((v, j) => j === i ? val : v));
            const addOpt = () => pollOpts.length < 4 && setPollOpts(o => [...o, '']);
            const delOpt = (i) => pollOpts.length > 2 && setPollOpts(o => o.filter((_, j) => j !== i));

            const submit = async () => {
                if (!text.trim() && !image && !(pollOn && pollQ.trim())) return;
                if (pollOn) {
                    if (!pollQ.trim()) { alert('Введи вопрос опроса'); return; }
                    if (pollOpts.filter(o => o.trim()).length < 2) { alert('Нужно минимум 2 варианта'); return; }
                }
                setPosting(true);
                try {
                    const payload = { text: text.trim(), image, mood, authorId: user.uid, authorName: profile.username, authorAvatar: profile.avatar, resonances: [], blows: [], commentsCount: 0, createdAt: Date.now() };
                    if (pollOn && pollQ.trim()) payload.poll = { question: pollQ.trim(), options: pollOpts.filter(o => o.trim()).map(o => ({ text: o.trim() })), votes: {} };
                    await db.collection('posts').add(payload);
                    await addGoCoins(user.uid, 25);

                } catch(err) { alert('Ошибка: ' + err.message); }
                setPosting(false);

                        <div className="mb-4">
                            <p className="text-xs font-bold text-slate-500 mb-2 ml-1">Выбери настроение</p>

                                        <span className="text-2xl mb-1">{m.emoji}</span><span className="text-[10px] font-bold text-slate-700">{m.name}</span>

                            </div>
                        </div>
                        <div className="flex items-center space-x-3 mb-3"><Avatar src={profile.avatar} name={profile.username} size={36} /><span className="font-bold text-sm">@{profile.username}</span><span className="ml-auto text-xs font-black text-amber-600">+25 🪙</span></div>
                        <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Что у тебя на душе?" rows="3" className="w-full p-3 bg-slate-50 rounded-2xl outline-none resize-none focus:ring-2 focus:ring-gopo/30 font-medium" />
                        {image && <div className="relative mt-3"><img src={image} className="rounded-2xl max-h-64 w-full object-cover" /><button onClick={()=>setImage(null)} className="absolute top-2 right-2 bg-black/60 text-white p-1.5 rounded-full"><I.X/></button></div>}
                        {pollOn && (
                            <div className="mt-3 bg-slate-50 rounded-2xl p-3 border border-slate-200">
                                <div className="flex justify-between items-center mb-2">
                                    <p className="text-xs font-bold text-slate-600">📊 Опрос</p>
                                    <button onClick={()=>{ setPollOn(false); setPollQ(''); setPollOpts(['','']); }} className="text-xs text-red-500 font-bold">Убрать</button>
                                </div>
                                <input value={pollQ} onChange={e=>setPollQ(e.target.value)} placeholder="Вопрос опроса" maxLength={120} className="w-full p-2.5 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-gopo text-sm font-medium mb-2" />
                                {pollOpts.map((o, i) => (
                                    <div key={i} className="flex gap-1 mb-1.5">
                                        <input value={o} onChange={e=>setOpt(i, e.target.value)} placeholder={`Вариант ${i+1}`} maxLength={80} className="flex-1 p-2.5 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-gopo text-sm font-medium" />
                                        {pollOpts.length > 2 && <button onClick={()=>delOpt(i)} className="px-2 text-slate-400 hover:text-red-500"><I.X/></button>}
                                    </div>
                                ))}
                                {pollOpts.length < 4 && <button onClick={addOpt} className="text-xs font-bold text-gopo">+ добавить вариант</button>}
                            </div>
                        )}
                        <div className="flex items-center justify-between mt-4 pt-4 border-t flex-wrap gap-2">
                            <div className="flex gap-2">
                                <button onClick={()=>fileRef.current.click()} className="flex items-center space-x-1 text-slate-500 hover:text-gopo font-bold p-2"><I.Image/><span className="text-xs">Фото</span></button>
                                <button onClick={()=>setPollOn(p=>!p)} className={`flex items-center space-x-1 font-bold p-2 ${pollOn?'text-gopo':'text-slate-500 hover:text-gopo'}`}><I.Chart/><span className="text-xs">Опрос</span></button>

                        <div className="flex-1 overflow-y-auto">

        const CreateGroupModal = ({ user, profile, usersMap, onClose }) => {
            const [name, setName] = useState('');

                    await db.collection('groups').add({ name: name.trim(), avatar, creatorId: user.uid, admins: [user.uid], members: [user.uid, ...selected], createdAt: firebase.firestore.FieldValue.serverTimestamp(), lastMessageAt: firebase.firestore.FieldValue.serverTimestamp() });

                        <div className="flex flex-col items-center mb-4">
                            <div onClick={()=>fileRef.current.click()} className="w-24 h-24 rounded-full bg-slate-100 flex items-center justify-center overflow-hidden cursor-pointer hover:bg-slate-200">
                                {avatar ? <img src={avatar} className="w-full h-full object-cover" /> : <div className="text-slate-400 text-center"><I.Group/><p className="text-[10px] font-bold mt-1">Аватар</p></div>}
                            </div>
                            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={async (e)=>{ const f=e.target.files[0]; if(f) setAvatar(await compressImage(f, 300, 0.7)); }} />
                        </div>
                        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Название группы" className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium" />
                        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Поиск участников..." className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium" />
                        <p className="text-xs font-bold text-slate-600 mb-2">Выбрано: {selected.length}</p>
                        <div className="max-h-48 overflow-y-auto mb-4 border border-slate-100 rounded-xl">
                            {filtered.map(u => (
                                <button key={u.uid} onClick={()=>toggle(u.uid)} className={`w-full flex items-center space-x-2 p-2 hover:bg-slate-50 ${selected.includes(u.uid)?'bg-pink-50':''}`}>
                                    <Avatar src={u.avatar} name={u.username} size={32} />
                                    <span className="font-bold text-sm flex-1 text-left truncate">{u.displayName || u.username}</span>
                                    {selected.includes(u.uid) && <span className="text-gopo font-black">✓</span>}
                                </button>
                            ))}
                        </div>
                        <button onClick={create} disabled={creating} className="w-full bg-gopo text-white font-bold py-3 rounded-xl disabled:opacity-50">{creating ? 'Создание...' : 'Создать группу'}</button>
                    </div>
                </div>
            );
        };

        const ChatView = ({ user, profile, other, onBack }) => {
            const [messages, setMessages] = useState([]);
            const [text, setText] = useState('');
            const [otherUser, setOtherUser] = useState(other);
            const [showEmojiPicker, setShowEmojiPicker] = useState(null);
            const [playingId, setPlayingId] = useState(null);
            const participants = [user.uid, other.uid].sort();
            const messagesRef = useRef(null);
            const endRef = useRef(null);
            const typingThrottle = useRef(0);
            const typingClear = useRef(null);
            const audioRefs = useRef({});
            const prevLen = useRef(0);
            const [, tick] = useState(0);
            useEffect(() => { const t = setInterval(()=>tick(x=>x+1), 5000); return () => clearInterval(t); }, []);
            useEffect(() => { const unsub = db.collection('users').doc(other.uid).onSnapshot(doc => { if (doc.exists) setOtherUser(doc.data()); }); return () => unsub(); }, [other.uid]);

            useEffect(() => { db.collection('users').doc(user.uid).update({ [`unreadCounts.${other.uid}`]: 0 }).catch(()=>{}); }, [user.uid, other.uid]);

            const isNearBottom = () => { const el = messagesRef.current; if (!el) return true; return el.scrollHeight - el.scrollTop - el.clientHeight < 120; };
            const scrollToBottom = (smooth) => { const el = messagesRef.current; if (!el) return; el.scrollTo({ top: el.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); };

            useEffect(() => {
                const unsub = db.collection('messages').where('participants','==',participants).onSnapshot(snap => {
                    const arr = snap.docs.map(d => ({id:d.id, reactions:{}, readBy:[], ...d.data()}));
                    arr.sort((a,b) => (a.createdAt?.toDate?.()?.getTime()||0) - (b.createdAt?.toDate?.()?.getTime()||0));
                    const grew = arr.length > prevLen.current;
                    const wasBottom = isNearBottom();
                    setMessages(arr);
                    if (grew) { prevLen.current = arr.length; if (wasBottom) setTimeout(() => scrollToBottom(true), 80); }
                    arr.filter(m => m.senderId === other.uid && !(m.readBy||[]).includes(user.uid))
                       .forEach(m => db.collection('messages').doc(m.id).update({readBy: firebase.firestore.FieldValue.arrayUnion(user.uid)}).catch(()=>{}));
                });
                return () => unsub();
            }, [participants.join(',')]);

            useEffect(() => { setTimeout(() => scrollToBottom(false), 100); }, []);
            useEffect(() => () => { db.collection('users').doc(user.uid).update({typingIn:null}).catch(()=>{}); clearTimeout(typingClear.current); }, [user.uid]);

            const delMsg = async (id) => { if (!window.confirm('Удалить сообщение?')) return; await db.collection('messages').doc(id).delete(); };
            const toggleReaction = async (msg, emoji) => {
                const cur = msg.reactions || {}; const users = cur[emoji] || []; const has = users.includes(user.uid);
                const nr = {...cur};
                if (has) { nr[emoji] = users.filter(u => u !== user.uid); if (nr[emoji].length === 0) delete nr[emoji]; }
                else nr[emoji] = [...users, user.uid];
                await db.collection('messages').doc(msg.id).update({reactions:nr});
                setShowEmojiPicker(null);
            };
            const handleChange = (val) => {
                setText(val);
                const ref = db.collection('users').doc(user.uid);
                if (!val.trim()) { ref.update({typingIn:null}).catch(()=>{}); clearTimeout(typingClear.current); return; }
                const now = Date.now();
                if (now - typingThrottle.current > 2000) { typingThrottle.current = now; ref.update({typingIn:other.uid, typingAt: firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{}); }
                clearTimeout(typingClear.current);
                typingClear.current = setTimeout(()=>ref.update({typingIn:null}).catch(()=>{}), 3000);
            };
            const send = async (e) => {
                e.preventDefault(); if (!text.trim()) return;
                await db.collection('messages').add({ participants, text: text.trim(), senderId: user.uid, readBy: [user.uid], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection('users').doc(other.uid).update({ [`unreadCounts.${user.uid}`]: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
                await addGoCoins(user.uid, 3);
                if (other.uid !== user.uid) sendNotification(other.uid, {uid:user.uid, username:profile.username, avatar:profile.avatar}, 'message', text.trim().slice(0,60));
                setText('');
                db.collection('users').doc(user.uid).update({typingIn:null}).catch(()=>{});
                clearTimeout(typingClear.current);
            };
            const playAudio = (msg) => {
                if (playingId === msg.id) { audioRefs.current[msg.id]?.pause(); setPlayingId(null); return; }
                Object.values(audioRefs.current).forEach(a => a?.pause());
                const a = new Audio(msg.audio); audioRefs.current[msg.id] = a; a.onended = () => setPlayingId(null); a.play(); setPlayingId(msg.id);
            };
            const isOtherTyping = isTypingNow(otherUser, user.uid);
            const isOtherOnline = isReallyOnline(otherUser);
            return (
                <div className="flex-1 flex flex-col h-full bg-white/40 min-h-0">
                    <div className="p-3 border-b border-white/50 flex items-center space-x-3 bg-white/50 backdrop-blur-md flex-shrink-0">
                        <button onClick={onBack} className="p-2 text-slate-600 hover:bg-white rounded-full md:hidden"><I.Back/></button>
                        <Avatar src={otherUser.avatar} name={otherUser.username} size={40} showStatus isOnline={isOtherOnline} halloweenFrame={otherUser.halloweenFrameId} />
                        <div className="flex-1 min-w-0">
                            <div className="flex items-center">
                                <span className="font-black text-sm truncate">{otherUser.displayName || otherUser.username}</span>
                                {otherUser.isVerified && <I.Check className="text-blue-500 ml-1"/>}
                                {otherUser.halloweenBadgeId && <span className="ml-1">{getItemById(otherUser.halloweenBadgeId)?.emoji}</span>}
                            </div>
                            {isOtherTyping ? <p className="text-xs text-gopo font-bold flex items-center">печатает <TypingDots className="ml-1 text-gopo" /></p>
                                : <p className={`text-xs font-bold ${isOtherOnline?'text-green-600':'text-slate-500'}`}>{formatLastSeen(otherUser)}</p>}
                        </div>
                    </div>
                    <div ref={messagesRef} className="flex-1 min-h-0 overflow-y-auto overflow-x-hidden p-4 space-y-2 messages-scroll">
                        {messages.length===0 && <p className="text-center text-slate-400 font-bold mt-10 text-sm">Начните диалог 👋 (+3 GoCoin за сообщение)</p>}
                        {messages.map(m => {
                            const mine = m.senderId === user.uid;
                            const reactions = m.reactions || {};
                            const wf = waveBars(m.id);
                            return (
                                <div key={m.id} className={`flex w-full ${mine ? 'justify-end' : 'justify-start'} group mb-2`}>
                                    <div className={`flex items-end gap-1.5 ${mine ? 'flex-row-reverse' : 'flex-row'}`}>
                                        <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                                            {mine && <button onClick={()=>delMsg(m.id)} className="p-1.5 rounded-full text-slate-300 hover:text-red-500 hover:bg-red-50"><I.Trash size={14}/></button>}
                                            <button onClick={()=>setShowEmojiPicker(showEmojiPicker===m.id?null:m.id)} className="p-1.5 rounded-full text-slate-300 hover:text-gopo text-sm">😊</button>
                                        </div>
                                        <div className={`max-w-[75vw] md:max-w-[75%] px-4 py-2.5 rounded-2xl text-sm font-medium shadow-sm break-words ${mine?'bg-gopo text-white rounded-br-sm':'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'}`}>
                                            {m.audio ? (
                                                <button onClick={()=>playAudio(m)} className="flex items-center space-x-2">
                                                    {playingId===m.id ? <I.Pause size={16}/> : <I.Play size={16}/>}
                                                    <div className="flex items-end space-x-0.5 h-5">{wf.map((h,i)=><span key={i} className={`w-0.5 ${mine?'bg-white':'bg-slate-600'}`} style={{height:`${h}%`}}></span>)}</div>
                                                    <span className="text-xs opacity-70">{m.audioDuration}s</span>
                                                </button>
                                            ) : m.text}
                                            {mine && <span className="inline-block ml-1 text-[10px] align-middle">{(m.readBy||[]).includes(other.uid)?'✓✓':'✓'}</span>}
                                        </div>
                                    </div>
                                    {Object.keys(reactions).length > 0 && (
                                        <div className={`flex space-x-1 mt-1 ${mine ? 'justify-end' : 'justify-start'}`}>
                                            {Object.entries(reactions).map(([emoji, users]) => users.length > 0 && (
                                                <button key={emoji} onClick={()=>toggleReaction(m, emoji)} className={`px-2 py-0.5 rounded-full text-xs font-bold flex items-center space-x-1 ${users.includes(user.uid)?'bg-gopo/15 text-gopo':'bg-white border border-slate-200 text-slate-600'}`}>
                                                    <span>{emoji}</span><span>{users.length}</span>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                    {showEmojiPicker === m.id && (
                                        <div className={`mt-1 bg-white border border-slate-200 rounded-full shadow-lg px-2 py-1 flex space-x-1 z-10 ${mine ? 'self-end' : 'self-start'}`}>
                                            {EMOJI_REACTIONS.map(e => <button key={e} onClick={()=>toggleReaction(m, e)} className="p-1.5 text-lg hover:scale-125 transition">{e}</button>)}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                        <div ref={endRef} />
                    </div>
                    <form onSubmit={send} className="p-3 border-t border-white/50 flex gap-2 bg-white/50 items-center flex-shrink-0">
                        <input value={text} onChange={e=>handleChange(e.target.value)} placeholder="Сообщение... (+3 🪙)" className="flex-1 p-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-gopo font-medium min-w-0" />
                        <button type="submit" disabled={!text.trim()} className="bg-gopo text-white p-3 rounded-xl shadow-md disabled:opacity-50 flex-shrink-0"><I.Send/></button>
                    </form>
                </div>
            );
        };

        const GroupChatView = ({ user, profile, group, usersMap, onBack }) => {
            const [messages, setMessages] = useState([]);
            const [text, setText] = useState('');
            const [liveGroup, setLiveGroup] = useState(group);
            const [showMembers, setShowMembers] = useState(false);
            const messagesRef = useRef(null);
            const endRef = useRef(null);
            const prevLen = useRef(0);
            useEffect(() => { const unsub = db.collection('groups').doc(group.id).onSnapshot(d => { if(d.exists) setLiveGroup(d.data()); }); return () => unsub(); }, [group.id]);
            useEffect(() => { db.collection('users').doc(user.uid).update({ [`unreadGroupCounts.${group.id}`]: 0 }).catch(()=>{}); }, [user.uid, group.id]);

            const scrollToBottom = (smooth) => { const el = messagesRef.current; if (el) el.scrollTo({ top: el.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); };
            const isNearBottom = () => { const el = messagesRef.current; if (!el) return true; return el.scrollHeight - el.scrollTop - el.clientHeight < 120; };

            useEffect(() => {
                const unsub = db.collection('groups').doc(group.id).collection('messages').onSnapshot(snap => {
                    const arr = snap.docs.map(d => ({id:d.id, ...d.data()}));
                    arr.sort((a,b) => (a.createdAt?.toDate?.()?.getTime()||0) - (b.createdAt?.toDate?.()?.getTime()||0));
                    const wasBottom = isNearBottom();
                    setMessages(arr);
                    if (arr.length > prevLen.current && wasBottom) { prevLen.current = arr.length; setTimeout(() => scrollToBottom(true), 80); }
                    else prevLen.current = arr.length;
                });
                return () => unsub();
            }, [group.id]);
            useEffect(() => { setTimeout(() => scrollToBottom(false), 100); }, []);

            const send = async (e) => {
                e.preventDefault(); if (!text.trim()) return;
                await db.collection('groups').doc(group.id).collection('messages').add({ senderId: user.uid, senderName: profile.username, senderAvatar: profile.avatar, text: text.trim(), createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection('groups').doc(group.id).update({lastMessageAt: firebase.firestore.FieldValue.serverTimestamp()});
                await addGoCoins(user.uid, 3);
                (liveGroup.members || []).forEach(uid => { if (uid !== user.uid) db.collection('users').doc(uid).update({ [`unreadGroupCounts.${group.id}`]: firebase.firestore.FieldValue.increment(1) }).catch(()=>{}); });
                setText('');
            };
            const delMsg = async (m) => {
                if (m.senderId !== user.uid && !(liveGroup.admins||[]).includes(user.uid)) return;
                if (!window.confirm('Удалить?')) return;

                        <div className="px-4 pb-6 space-y-3 bg-slate-50">
                            <h3 className="font-black text-sm pt-4 mb-2">Пузыри</h3>

                                const mood = MOODS[post.mood] || MOODS.neutral;
                                return (
                                    <div key={post.id} className={`rounded-[2rem] p-4 border-2 ${mood.bg} ${mood.border} ${ps}`}>
                                        <div className="flex justify-between items-center mb-2">
                                            <p className={`text-xs opacity-70 ${mood.text}`}>{timeAgo(post.createdAt)}</p>
                                            <span className="text-xl">{mood.emoji}</span>
                                        </div>
                                        {post.text && <p className={`text-sm mb-2 ${mood.text}`}>{post.text}</p>}
                                        {post.image && <img src={post.image} className="rounded-xl max-h-60 w-full object-cover shadow-sm" />}
                                    </div>
                                );
                            })}
                            {targetPosts.length===0 && <p className="text-center text-slate-400 font-bold text-sm py-4">Пузырей нет</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminTab = ({ user, usersMap }) => {
            const users = Object.values(usersMap);
            const me = usersMap[user.uid];
            const showTyping = me?.showTypingFeed !== false;
            const [adminTab, setAdminTab] = useState('users');
            const [pendingTracks, setPendingTracks] = useState([]);
            const [playingId, setPlayingId] = useState(null);
            const [rejectingTrack, setRejectingTrack] = useState(null);
            const [rejectReason, setRejectReason] = useState('');
            const audioRefs = useRef({});
            const [, tick] = useState(0);
            useEffect(() => { const t = setInterval(()=>tick(x=>x+1), 5000); return () => clearInterval(t); }, []);
            useEffect(() => {
                const unsub = db.collection('tracks').onSnapshot(snap => {
                    const arr = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(t => t.status === 'pending');
                    arr.sort((a,b) => (a.createdAt?.toDate?.()?.getTime()||0) - (b.createdAt?.toDate?.()?.getTime()||0));
                    setPendingTracks(arr);
                });
                return () => unsub();
            }, []);
            const toggleVerify = async (id, cur) => await db.collection('users').doc(id).update({isVerified:!cur});
            const toggleBan = async (id, cur) => { if (window.confirm(cur?'Разбанить?':'Забанить?')) await db.collection('users').doc(id).update({isBanned:!cur}); };
            const toggleTyping = async () => await db.collection('users').doc(user.uid).update({showTypingFeed:!showTyping});
            const playTrackPreview = (t) => {
                if (playingId === t.id) { audioRefs.current[t.id]?.pause(); setPlayingId(null); return; }
                Object.values(audioRefs.current).forEach(a => a?.pause());
                const a = new Audio(t.audioUrl); audioRefs.current[t.id] = a; a.onended = () => setPlayingId(null); a.play().catch(()=>{}); setPlayingId(t.id);
            };
            const approveTrack = async (t) => {
                await db.collection('tracks').doc(t.id).update({ status: 'approved', rejectionReason: '', moderatedBy: user.uid, moderatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                sendNotification(t.uploadedBy, {uid:user.uid, username:'admin', avatar:null}, 'music_approved', `Трек «${t.title}» опубликован`, {trackId: t.id});
            };
            const confirmReject = async () => {
                if (!rejectingTrack) return;
                if (!rejectReason.trim()) { alert('Укажите причину'); return; }
                await db.collection('tracks').doc(rejectingTrack.id).update({ status: 'rejected', rejectionReason: rejectReason.trim(), moderatedBy: user.uid, moderatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                sendNotification(rejectingTrack.uploadedBy, {uid:user.uid, username:'admin', avatar:null}, 'music_rejected', rejectReason.trim(), {trackId: rejectingTrack.id});
                setRejectingTrack(null); setRejectReason('');
            };
            const typingUsers = users.filter(u => { if (!u.typingIn) return false; if (!u.typingAt) return true; try { return (Date.now()-u.typingAt.toDate().getTime()) < 6000; } catch { return true; } });
            const onlineCount = users.filter(u => isReallyOnline(u)).length;
            return (
                <div className="fade-in space-y-6">
                    <div className="flex items-center space-x-2 text-red-500"><I.Shield/><h1 className="text-2xl font-black">Админ-панель</h1></div>
                    <div className="flex space-x-2 bg-white rounded-2xl p-1 shadow-sm">
                        <button onClick={()=>setAdminTab('users')} className={`flex-1 py-2 rounded-xl text-sm font-bold ${adminTab==='users'?'bg-gopo text-white':'text-slate-600'}`}>Пользователи</button>
                        <button onClick={()=>setAdminTab('music')} className={`flex-1 py-2 rounded-xl text-sm font-bold relative ${adminTab==='music'?'bg-gopo text-white':'text-slate-600'}`}>

                            {pendingTracks.length > 0 && <span className={`ml-1 text-[10px] font-black px-1.5 py-0.5 rounded-full ${adminTab==='music'?'bg-white text-gopo':'bg-gopo text-white'}`}>{pendingTracks.length}</span>}
                        </button>
                    </div>
                    {adminTab === 'users' && (
                        <>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-white/80 rounded-2xl p-4 border border-white/50 shadow-sm"><p className="text-xs font-bold text-slate-500 uppercase">Всего</p><p className="text-2xl font-black text-slate-800">{users.length}</p></div>
                                <div className="bg-green-50 rounded-2xl p-4 border border-green-200 shadow-sm"><p className="text-xs font-bold text-green-700 uppercase">Онлайн</p><p className="text-2xl font-black text-green-800">{onlineCount}</p></div>
                            </div>
                            <div className={`rounded-2xl p-4 border-2 transition ${showTyping?'bg-purple-50 border-purple-200':'bg-slate-50 border-slate-200'}`}>
                                <div className="flex items-center justify-between">
                                    <div className="flex-1 min-w-0">
                                        <p className="font-black text-sm text-slate-800 flex items-center"><I.Eye className="mr-2 text-purple-500" />Трекинг печатающих</p>
                                        <p className="text-xs text-slate-500 font-medium mt-1">{showTyping?'Показывать, кто и кому печатает':'Скрыто'}</p>
                                    </div>
                                    <button onClick={toggleTyping} className={`relative w-12 h-6 rounded-full transition ${showTyping?'bg-purple-500':'bg-slate-300'}`}>
                                        <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ${showTyping?'left-6':'left-0.5'}`}></span>
                                    </button>
                                </div>
                                {showTyping && (
                                    <div className="mt-3 pt-3 border-t border-purple-200">
                                        <p className="text-[10px] font-bold text-purple-700 uppercase mb-2">Сейчас печатают:</p>

                                            <div className="space-y-2">
                                                {typingUsers.map(u => { const target = usersMap[u.typingIn]; return (
                                                    <div key={u.uid} className="flex items-center space-x-2 bg-white/80 rounded-xl p-2">
                                                        <Avatar src={u.avatar} name={u.username} size={28} />
                                                        <p className="text-xs font-bold text-slate-800 truncate flex-1">@{u.username} <span className="text-slate-400 font-medium">→</span> {target?`@${target.username}`:'...'}</p>
                                                        <TypingDots className="text-purple-500" />
                                                    </div>
                                                ); })}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                            <div>
                                <p className="text-slate-500 text-sm font-medium mb-3">Управление пользователями</p>
                                <div className="liquid-glass rounded-3xl overflow-hidden shadow-sm">
                                    {users.map(u => {
                                        const online = isReallyOnline(u);
                                        return (
                                            <div key={u.uid} className={`p-4 border-b border-white/50 last:border-0 ${u.isBanned?'bg-red-50/50':''}`}>
                                                <div className="flex items-center space-x-3 mb-2">
                                                    <Avatar src={u.avatar} name={u.username} size={42} showStatus isOnline={online} halloweenFrame={u.halloweenFrameId} />
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center"><span className="font-black text-sm truncate">{u.displayName || u.username}</span>{u.isVerified && <I.Check className="text-blue-500 ml-1 flex-shrink-0"/>}</div>
                                                        <p className="text-xs text-slate-400 truncate">@{u.username} • 🪙 {u.goCoins || 0}</p>
                                                        <p className={`text-[10px] font-bold ${online?'text-green-600':'text-slate-400'}`}>{formatLastSeen(u)}</p>
                                                        {u.isBanned && <p className="text-[10px] text-red-500 font-bold">ЗАБАНЕН</p>}
                                                    </div>
                                                </div>
                                                {u.uid !== user.uid && (
                                                    <div className="flex gap-2 mt-2">
                                                        <button onClick={()=>toggleVerify(u.uid, u.isVerified)} className={`flex-1 text-xs font-bold py-2 rounded-lg border-2 ${u.isVerified?'border-blue-500 text-blue-500':'border-slate-200 text-slate-600 bg-white/50'}`}>{u.isVerified?'Снять галочку':'Дать галочку'}</button>
                                                        <button onClick={()=>toggleBan(u.uid, u.isBanned)} className={`flex-1 text-xs font-bold py-2 rounded-lg border-2 ${u.isBanned?'border-green-500 text-green-600 bg-white/50':'border-red-500 text-red-500 bg-white/50'}`}>{u.isBanned?'Разбанить':'Забанить'}</button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </>
                    )}
                    {adminTab === 'music' && (
                        <div>
                            <p className="text-slate-500 text-sm font-medium mb-3">Треки на проверке ({pendingTracks.length})</p>
                            {pendingTracks.length === 0 ? (
                                <div className="text-center p-16 bg-white rounded-3xl text-slate-400"><I.Music/><p className="mt-4 font-bold">Нет треков на модерации</p></div>
                            ) : (
                                <div className="space-y-3">
                                    {pendingTracks.map(t => (
                                        <div key={t.id} className="bg-white rounded-2xl p-4 shadow-sm">
                                            <div className="flex items-start space-x-3 mb-3">
                                                {t.cover ? <img src={t.cover} className="w-16 h-16 rounded-xl object-cover flex-shrink-0" /> : <div className="w-16 h-16 rounded-xl bg-gopo text-white flex items-center justify-center flex-shrink-0"><I.Music/></div>}
                                                <div className="flex-1 min-w-0">
                                                    <p className="font-black text-sm truncate">{t.title}</p>
                                                    <p className="text-xs text-slate-500 truncate">{t.artist}</p>
                                                    <p className="text-[10px] text-slate-400 mt-1">@{t.uploaderName} · {timeAgo(t.createdAt)}</p>
                                                </div>
                                            </div>
                                            <button onClick={()=>playTrackPreview(t)} className="w-full flex items-center justify-center space-x-2 bg-slate-100 hover:bg-slate-200 py-2 rounded-xl font-bold text-sm mb-3">
                                                {playingId===t.id ? <I.Pause size={16}/> : <I.Play size={16}/>}
                                                <span>{playingId===t.id ? 'Пауза' : 'Прослушать'}</span>
                                            </button>
                                            <div className="flex gap-2">
                                                <button onClick={()=>approveTrack(t)} className="flex-1 bg-green-500 text-white font-bold py-2 rounded-xl">Принять</button>
                                                <button onClick={()=>{setRejectingTrack(t); setRejectReason('');}} className="flex-1 bg-red-500 text-white font-bold py-2 rounded-xl">Отклонить</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                    {rejectingTrack && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[80] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm">
                                <h3 className="font-black text-lg mb-3">Причина отклонения</h3>
                                <p className="text-xs text-slate-500 mb-3">Трек «{rejectingTrack.title}»</p>
                                <textarea value={rejectReason} onChange={e=>setRejectReason(e.target.value)} rows="3" placeholder="Например: плохое качество записи" className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium resize-none" />
                                <div className="flex gap-2">
                                    <button onClick={()=>{setRejectingTrack(null); setRejectReason('');}} className="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl">Отмена</button>
                                    <button onClick={confirmReject} className="flex-1 bg-red-500 text-white font-bold py-2.5 rounded-xl">Отклонить</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MusicTab = ({ user, profile, playerTrack, playerPlaying, playTrack }) => {
            const [tracks, setTracks] = useState([]);
            const [tab, setTab] = useState('all');
            const [showUpload, setShowUpload] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            useEffect(() => {
                const unsub = db.collection('tracks').onSnapshot(snap => {
                    const arr = snap.docs.map(d => ({id:d.id, ...d.data()}));
                    arr.sort((a,b) => (b.createdAt?.toDate?.()?.getTime()||0) - (a.createdAt?.toDate?.()?.getTime()||0));
                    setTracks(arr);
                });
                return () => unsub();
            }, []);
            const saved = profile.savedTracks || [];
            const myTracks = tracks.filter(t => t.uploadedBy === user.uid);
            const approved = tracks.filter(t => t.status === 'approved');
            const savedTracks = approved.filter(t => saved.includes(t.id));
            const source = tab === 'mine' ? myTracks : tab === 'saved' ? savedTracks : approved;
            const filtered = source.filter(t => !searchQuery || (t.title||'').toLowerCase().includes(searchQuery.toLowerCase()) || (t.artist||'').toLowerCase().includes(searchQuery.toLowerCase()));
            const toggleSave = async (track) => {
                const myRef = db.collection('users').doc(user.uid);
                if (saved.includes(track.id)) await myRef.update({savedTracks: firebase.firestore.FieldValue.arrayRemove(track.id)});
                else await myRef.update({savedTracks: firebase.firestore.FieldValue.arrayUnion(track.id)});
            };
            const delTrack = async (track) => {
                if (track.uploadedBy !== user.uid && user.email !== ADMIN_EMAIL) return;
                if (!window.confirm('Удалить трек?')) return;
                try { await db.collection('tracks').doc(track.id).delete(); } catch(e) { alert(e.message); }
            };
            const statusBadge = (status) => {
                if (status === 'pending') return <span className="text-[10px] font-black text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full">На проверке</span>;
                if (status === 'rejected') return <span className="text-[10px] font-black text-red-600 bg-red-100 px-2 py-0.5 rounded-full">Отклонён</span>;
                if (status === 'approved') return <span className="text-[10px] font-black text-green-600 bg-green-100 px-2 py-0.5 rounded-full">Одобрен</span>;
                return null;
            };
            return (
                <div className="fade-in">
                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center space-x-2"><I.Music/><h1 className="text-2xl font-black">Музыка</h1></div>
                        <button onClick={() => { 
                            if (window.innerWidth < 768) { alert('Загрузка музыки доступна пока только на ПК 💻'); return; } 
                            setShowUpload(true); 
                        }} className="bg-gopo text-white font-bold px-4 py-2 rounded-xl shadow-md flex items-center space-x-2"><I.Upload/><span className="hidden sm:inline">Загрузить</span></button>
                    </div>
                    <div className="relative mb-4">
                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><I.Search/></div>
                        <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Поиск треков..." className="w-full p-3 pl-12 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-gopo font-medium" />
                    </div>
                    <div className="flex space-x-2 mb-4 flex-wrap gap-y-2">
                        <button onClick={()=>setTab('all')} className={`px-4 py-2 rounded-xl text-sm font-bold ${tab==='all'?'bg-gopo text-white shadow':'bg-white text-slate-600'}`}>Все</button>
                        <button onClick={()=>setTab('mine')} className={`px-4 py-2 rounded-xl text-sm font-bold ${tab==='mine'?'bg-gopo text-white shadow':'bg-white text-slate-600'}`}>Мои ({myTracks.length})</button>
                        <button onClick={()=>setTab('saved')} className={`px-4 py-2 rounded-xl text-sm font-bold ${tab==='saved'?'bg-gopo text-white shadow':'bg-white text-slate-600'}`}>Сохранённые ({savedTracks.length})</button>
                    </div>
                    {filtered.length === 0 ? (
                        <div className="text-center p-16 bg-white rounded-3xl text-slate-400"><I.Music/><p className="mt-4 font-bold">{tab==='mine'?'У вас нет треков':tab==='saved'?'Нет сохранённых':'Треков нет'}</p></div>
                    ) : (
                        <div className="bg-white rounded-3xl overflow-hidden shadow-sm">
                            {filtered.map(t => {
                                const isCur = playerTrack?.id === t.id;
                                const isSaved = saved.includes(t.id);
                                const canDel = t.uploadedBy === user.uid || user.email === ADMIN_EMAIL;
                                const isRejected = t.status === 'rejected';
                                const playable = t.status === 'approved';
                                return (
                                    <div key={t.id} className={`flex items-center space-x-3 p-3 border-b border-slate-50 last:border-0 hover:bg-slate-50 ${isCur?'bg-pink-50/60':''}`}>
                                        <button onClick={()=>{ if (playable) playTrack(t, filtered.filter(x=>x.status==='approved')); }} disabled={!playable}
                                            className={`w-11 h-11 rounded-xl flex-shrink-0 flex items-center justify-center shadow-sm ${isCur?'bg-gopo text-white':'bg-slate-100 text-slate-600'} ${!playable?'opacity-40 cursor-not-allowed':''}`}>
                                            {isCur && playerPlaying ? <I.Pause/> : <I.Play/>}
                                        </button>
                                        {t.cover ? <img src={t.cover} className="w-11 h-11 rounded-lg object-cover flex-shrink-0" /> : <div className="w-11 h-11 rounded-lg bg-gopo text-white flex items-center justify-center flex-shrink-0"><I.Music/></div>}
                                        <div className="flex-1 min-w-0">
                                            <div className="flex items-center space-x-2"><p className="font-black text-sm truncate">{t.title}</p>{tab === 'mine' && statusBadge(t.status)}</div>
                                            <p className="text-xs text-slate-500 truncate">{t.artist} · @{t.uploaderName}</p>
                                            {isRejected && t.rejectionReason && <p className="text-[10px] text-red-500 font-bold mt-0.5">Причина: {t.rejectionReason}</p>}
                                        </div>
                                        {playable && <button onClick={()=>toggleSave(t)} className={`p-2 rounded-full ${isSaved?'text-gopo':'text-slate-300 hover:text-slate-500'}`}><I.Heart filled={isSaved}/></button>}
                                        {canDel && <button onClick={()=>delTrack(t)} className="p-2 text-slate-300 hover:text-red-500"><I.Trash size={14}/></button>}
                                    </div>
                                );
                            })}
                        </div>
