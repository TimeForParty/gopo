                                                        </div>
                                                        <p className="text-xs text-slate-400 truncate">@{u.username}</p>
                                                        <p className={`text-[10px] font-bold ${online?'text-green-600':'text-slate-400'}`}>{formatLastSeen(u)}</p>
                                                        {u.isBanned && <p className="text-[10px] text-red-500 font-bold">ЗАБАНЕН</p>}
                                                    </div>
                                                </div>
                                                {u.uid !== user.uid && (
                                                    <div className="flex gap-2 mt-2">
                                                        <button onClick={()=>toggleVerify(u.uid, u.isVerified)} className={`flex-1 text-xs font-bold py-2 rounded-lg border-2 ${u.isVerified?'border-blue-500 text-blue-500':'border-slate-200 text-slate-600 bg-white/50'}`}>{u.isVerified?'Снять галочку':'Дать галочку'}</button>
                                                        <button onClick={()=>toggleBan(u.uid, u.isBanned)} className={`flex-1 text-xs font-bold py-2 rounded-lg border-2 ${u.isBanned?'border-green-500 text-green-600 bg-white/50':'border-red-500 text-red-500 bg-white/50'}`}>{u.isBanned?'Разбанить':'Забанить'}</button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </>
                    )}

                    {adminTab === 'music' && (
                        <div>
                            <p className="text-slate-500 text-sm font-medium mb-3">Треки на проверке ({pendingTracks.length})</p>
                            {pendingTracks.length === 0 ? (
                                <div className="text-center p-16 bg-white rounded-3xl text-slate-400"><I.Music/><p className="mt-4 font-bold">Нет треков на модерации</p></div>
                            ) : (
                                <div className="space-y-3">
                                    {pendingTracks.map(t => (
                                        <div key={t.id} className="bg-white rounded-2xl p-4 shadow-sm">
                                            <div className="flex items-start space-x-3 mb-3">
                                                {t.cover ? <img src={t.cover} className="w-16 h-16 rounded-xl object-cover flex-shrink-0" /> : <div className="w-16 h-16 rounded-xl bg-gopo text-white flex items-center justify-center flex-shrink-0"><I.Music/></div>}
                                                <div className="flex-1 min-w-0">
                                                    <p className="font-black text-sm truncate">{t.title}</p>
                                                    <p className="text-xs text-slate-500 truncate">{t.artist}</p>
                                                    <p className="text-[10px] text-slate-400 mt-1">@{t.uploaderName} · {timeAgo(t.createdAt)}</p>
                                                </div>
                                            </div>
                                            <button onClick={()=>playTrackPreview(t)} className="w-full flex items-center justify-center space-x-2 bg-slate-100 hover:bg-slate-200 py-2 rounded-xl font-bold text-sm mb-3">
                                                {playingId===t.id ? <I.Pause size={16}/> : <I.Play size={16}/>}
                                                <span>{playingId===t.id ? 'Пауза' : 'Прослушать'}</span>
                                            </button>
                                            <div className="flex gap-2">
                                                <button onClick={()=>approveTrack(t)} className="flex-1 bg-green-500 text-white font-bold py-2 rounded-xl">Принять</button>
                                                <button onClick={()=>{setRejectingTrack(t); setRejectReason('');}} className="flex-1 bg-red-500 text-white font-bold py-2 rounded-xl">Отклонить</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {rejectingTrack && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[80] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm">
                                <h3 className="font-black text-lg mb-3">Причина отклонения</h3>
                                <p className="text-xs text-slate-500 mb-3">Трек «{rejectingTrack.title}»</p>
                                <textarea value={rejectReason} onChange={e=>setRejectReason(e.target.value)} rows="3" placeholder="Например: плохое качество записи / нарушение авторских прав" className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium resize-none" />
                                <div className="flex gap-2">
                                    <button onClick={()=>{setRejectingTrack(null); setRejectReason('');}} className="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl">Отмена</button>
                                    <button onClick={confirmReject} className="flex-1 bg-red-500 text-white font-bold py-2.5 rounded-xl">Отклонить</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MusicTab = ({ user, profile, playerTrack, playerPlaying, playTrack }) => {
            const [tracks, setTracks] = useState([]);
            const [tab, setTab] = useState('all');
            const [showUpload, setShowUpload] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            useEffect(() => {
                const unsub = db.collection('tracks').onSnapshot(snap => {
                    const arr = snap.docs.map(d => ({id:d.id, ...d.data()}));
                    arr.sort((a,b) => (b.createdAt?.toDate?.()?.getTime()||0) - (a.createdAt?.toDate?.()?.getTime()||0));
                    setTracks(arr);
                });
                return () => unsub();
            }, []);
            const saved = profile.savedTracks || [];
            const myTracks = tracks.filter(t => t.uploadedBy === user.uid);
            const approved = tracks.filter(t => t.status === 'approved');
            const savedTracks = approved.filter(t => saved.includes(t.id));
            const source = tab === 'mine' ? myTracks : tab === 'saved' ? savedTracks : approved;
            const filtered = source.filter(t => !searchQuery || (t.title||'').toLowerCase().includes(searchQuery.toLowerCase()) || (t.artist||'').toLowerCase().includes(searchQuery.toLowerCase()));
            const toggleSave = async (track) => {
                const myRef = db.collection('users').doc(user.uid);
                if (saved.includes(track.id)) await myRef.update({savedTracks: firebase.firestore.FieldValue.arrayRemove(track.id)});
                else await myRef.update({savedTracks: firebase.firestore.FieldValue.arrayUnion(track.id)});
            };
            const delTrack = async (track) => {
                if (track.uploadedBy !== user.uid && user.email !== 'hvadim439@gmail.com') return;
                if (!window.confirm('Удалить трек?')) return;
                try { await db.collection('tracks').doc(track.id).delete(); } catch(e) { alert(e.message); }
            };
            const statusBadge = (status) => {
                if (status === 'pending') return <span className="text-[10px] font-black text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full">На проверке</span>;
                if (status === 'rejected') return <span className="text-[10px] font-black text-red-600 bg-red-100 px-2 py-0.5 rounded-full">Отклонён</span>;
                if (status === 'approved') return <span className="text-[10px] font-black text-green-600 bg-green-100 px-2 py-0.5 rounded-full">Одобрен</span>;
                return null;
            };
            return (
                <div className="fade-in">
                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center space-x-2"><I.Music/><h1 className="text-2xl font-black">Музыка</h1></div>
                        <button onClick={()=>setShowUpload(true)} className="bg-gopo text-white font-bold px-4 py-2 rounded-xl shadow-md flex items-center space-x-2">
                            <I.Upload/><span className="hidden sm:inline">Загрузить</span>
                        </button>
                    </div>
                    <div className="relative mb-4">
                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><I.Search/></div>
                        <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Поиск треков..." className="w-full p-3 pl-12 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-gopo font-medium" />
                    </div>
                    <div className="flex space-x-2 mb-4 flex-wrap gap-y-2">
                        <button onClick={()=>setTab('all')} className={`px-4 py-2 rounded-xl text-sm font-bold ${tab==='all'?'bg-gopo text-white shadow':'bg-white text-slate-600'}`}>Все</button>
                        <button onClick={()=>setTab('mine')} className={`px-4 py-2 rounded-xl text-sm font-bold ${tab==='mine'?'bg-gopo text-white shadow':'bg-white text-slate-600'}`}>Мои ({myTracks.length})</button>
                        <button onClick={()=>setTab('saved')} className={`px-4 py-2 rounded-xl text-sm font-bold ${tab==='saved'?'bg-gopo text-white shadow':'bg-white text-slate-600'}`}>Сохранённые ({savedTracks.length})</button>
                    </div>
                    {filtered.length === 0 ? (
                        <div className="text-center p-16 bg-white rounded-3xl text-slate-400"><I.Music/><p className="mt-4 font-bold">{tab==='mine'?'У вас нет треков':tab==='saved'?'Нет сохранённых':'Треков нет'}</p></div>
                    ) : (
                        <div className="bg-white rounded-3xl overflow-hidden shadow-sm">
                            {filtered.map(t => {
                                const isCur = playerTrack?.id === t.id;
                                const isSaved = saved.includes(t.id);
                                const canDel = t.uploadedBy === user.uid || user.email === 'hvadim439@gmail.com';
                                const isPending = t.status === 'pending';
                                const isRejected = t.status === 'rejected';
                                const playable = t.status === 'approved';
                                return (
                                    <div key={t.id} className={`flex items-center space-x-3 p-3 border-b border-slate-50 last:border-0 hover:bg-slate-50 ${isCur?'bg-pink-50/60':''}`}>
                                        <button onClick={()=>{ if (playable) playTrack(t, filtered.filter(x=>x.status==='approved')); }} disabled={!playable}
                                            className={`w-11 h-11 rounded-xl flex-shrink-0 flex items-center justify-center shadow-sm ${isCur?'bg-gopo text-white':'bg-slate-100 text-slate-600'} ${!playable?'opacity-40 cursor-not-allowed':''}`}>
                                            {isCur && playerPlaying ? <I.Pause/> : <I.Play/>}
                                        </button>
                                        {t.cover ? <img src={t.cover} className="w-11 h-11 rounded-lg object-cover flex-shrink-0" /> : <div className="w-11 h-11 rounded-lg bg-gopo text-white flex items-center justify-center flex-shrink-0"><I.Music/></div>}
                                        <div className="flex-1 min-w-0">
                                            <div className="flex items-center space-x-2">
                                                <p className="font-black text-sm truncate">{t.title}</p>
                                                {tab === 'mine' && statusBadge(t.status)}
                                            </div>
                                            <p className="text-xs text-slate-500 truncate">{t.artist} · @{t.uploaderName}</p>
                                            {isRejected && t.rejectionReason && (
                                                <p className="text-[10px] text-red-500 font-bold mt-0.5">Причина: {t.rejectionReason}</p>
                                            )}
                                        </div>
                                        {playable && (
                                            <button onClick={()=>toggleSave(t)} className={`p-2 rounded-full ${isSaved?'text-gopo':'text-slate-300 hover:text-slate-500'}`} title={isSaved?'Убрать из сохранённых':'Сохранить себе'}><I.Heart filled={isSaved}/></button>
                                        )}
                                        {canDel && <button onClick={()=>delTrack(t)} className="p-2 text-slate-300 hover:text-red-500"><I.Trash size={14}/></button>}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                    {showUpload && <UploadTrackModal user={user} profile={profile} onClose={()=>setShowUpload(false)} />}
                </div>
            );
        };

        const UploadTrackModal = ({ user, profile, onClose }) => {
            const [title, setTitle] = useState('');
            const [artist, setArtist] = useState('');
            const [audioFile, setAudioFile] = useState(null);
            const [coverFile, setCoverFile] = useState(null);
            const [coverPreview, setCoverPreview] = useState(null);
            const [uploading, setUploading] = useState(false);
            const [progress, setProgress] = useState('');
            const audioRef = useRef(null);
            const coverRef = useRef(null);

            const pickCover = async (e) => {
                const f = e.target.files[0];
                if (!f) return;
                setCoverFile(f);
                setCoverPreview(await compressImage(f, 400, 0.7));
            };

            const getAuth = async () => {
                const r = await fetch('https://gopo-web.vercel.app/api/imagekit-auth');
                if (!r.ok) throw new Error('Не удалось получить подпись ImageKit');
                return r.json();
            };

            const uploadFile = async (file, fileName, folder, auth, onProgress) => {
                const form = new FormData();
                form.append('file', file);
                form.append('fileName', fileName);
                form.append('folder', folder);
                form.append('publicKey', auth.publicKey);
                form.append('token', auth.token);
                form.append('expire', String(auth.expire));
                form.append('signature', auth.signature);
                form.append('useUniqueFilename', 'true');
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', 'https://upload.imagekit.io/api/v1/files/upload');
                    xhr.timeout = 30000;
                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
                    };
                    xhr.onload = () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            try { resolve(JSON.parse(xhr.responseText)); }
                            catch { reject(new Error('Некорректный ответ ImageKit')); }
                        } else {
                            let msg = 'Upload failed (HTTP ' + xhr.status + ')';
                            try { const j = JSON.parse(xhr.responseText); msg = j.message || (j.error && j.error.message) || msg; } catch {}
                            reject(new Error(msg));
                        }
                    };
                    xhr.onerror = () => reject(new Error('Network error'));
                    xhr.ontimeout = () => reject(new Error('Таймаут загрузки'));
                    xhr.send(form);
                });
            };

            const submit = async () => {
                if (!audioFile || !title.trim()) { alert('Введите название и загрузите аудио'); return; }
                if (audioFile.size > 25 * 1024 * 1024) { alert('Файл больше 25 МБ. ImageKit не пропустит на бесплатном плане.'); return; }
                setUploading(true);
                setProgress('Получаем подпись...');
                try {
                    const auth = await getAuth();
                    let coverUrl = '';
                    if (coverFile) {
                        setProgress('Загружаем обложку...');
                        const coverRes = await uploadFile(coverFile, `cover_${Date.now()}_${coverFile.name}`, '/music/covers', auth);
                        coverUrl = coverRes.url;
                    }
                    setProgress('Загружаем аудио...');
                    const audioRes = await uploadFile(audioFile, `audio_${Date.now()}_${audioFile.name}`, '/music/audio', auth, (p) => setProgress(`Аудио: ${p}%`));
                    await db.collection('tracks').add({
                        title: title.trim(),
                        artist: artist.trim() || 'Неизвестен',
                        cover: coverUrl,
                        audioUrl: audioRes.url,
                        uploadedBy: user.uid,
                        uploaderName: profile.username,
                        status: 'pending',
                        rejectionReason: '',
                        plays: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    onClose();
                } catch (e) {
                    console.error('ImageKit upload error:', e);
                    alert('Ошибка загрузки: ' + e.message);
                }
                setUploading(false);
                setProgress('');
            };

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-black">Загрузить трек</h2>
                            <button onClick={onClose} className="p-2 text-slate-400"><I.X/></button>
                        </div>
                        <div className="flex flex-col items-center mb-4">
                            <div onClick={()=>coverRef.current.click()} className="w-32 h-32 rounded-2xl bg-slate-100 flex items-center justify-center overflow-hidden cursor-pointer hover:bg-slate-200 transition">
                                {coverPreview ? <img src={coverPreview} className="w-full h-full object-cover" /> : <div className="text-slate-400 text-center"><I.Image/><p className="text-xs font-bold mt-1">Обложка</p></div>}
                            </div>
                            <input ref={coverRef} type="file" accept="image/*" className="hidden" onChange={pickCover} />
                        </div>
                        <label className="text-xs font-bold text-slate-600 ml-1">Название</label>
                        <input value={title} onChange={e=>setTitle(e.target.value)} className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium" placeholder="Название трека" />
                        <label className="text-xs font-bold text-slate-600 ml-1">Исполнитель</label>
                        <input value={artist} onChange={e=>setArtist(e.target.value)} className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium" placeholder="Исполнитель" />
                        <label className="text-xs font-bold text-slate-600 ml-1">Аудиофайл (до 25 МБ)</label>
                        <div onClick={()=>audioRef.current.click()} className="w-full p-3 bg-slate-50 rounded-xl cursor-pointer mb-4 text-sm font-bold text-slate-600 hover:bg-slate-100">
                            {audioFile ? `✓ ${audioFile.name}` : 'Выбрать MP3 / M4A / OGG'}
                        </div>
                        <input ref={audioRef} type="file" accept="audio/*" className="hidden" onChange={e=>setAudioFile(e.target.files[0])} />
                        {uploading && <p className="text-sm font-bold text-gopo text-center mb-3">{progress || 'Загрузка...'}</p>}
                        <button onClick={submit} disabled={uploading} className="w-full bg-gopo text-white font-bold py-3 rounded-xl disabled:opacity-50">
                            {uploading ? 'Загрузка...' : 'Отправить на проверку'}
                        </button>
                        <p className="text-[10px] text-slate-400 font-bold text-center mt-2">Трек появится в общей ленте после одобрения админом</p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
