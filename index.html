                    {showUpload && <UploadTrackModal user={user} profile={profile} onClose={()=>setShowUpload(false)} />}
                </div>
            );
        };

        const UploadTrackModal = ({ user, profile, onClose }) => {
            const [title, setTitle] = useState('');
            const [artist, setArtist] = useState('');
            const [audioFile, setAudioFile] = useState(null);
            const [coverFile, setCoverFile] = useState(null);
            const [coverPreview, setCoverPreview] = useState(null);
            const [uploading, setUploading] = useState(false);
            const [progress, setProgress] = useState('');
            const audioRef = useRef(null);
            const coverRef = useRef(null);
            const pickCover = async (e) => { const f = e.target.files[0]; if (!f) return; setCoverFile(f); setCoverPreview(await compressImage(f, 400, 0.7)); };
            const getUploadUrl = async (fileName, fileType, folder) => {
                const res = await fetch(`${WORKER_BASE}/api/presign`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fileName, fileType, folder }) });
                if (!res.ok) throw new Error('Не удалось получить ссылку (' + res.status + ')');
                return res.json();
            };
            const uploadFileDirect = async (file, uploadUrl, onProgress) => new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('PUT', uploadUrl);
                xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
                xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100)); };
                xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('HTTP ' + xhr.status));
                xhr.onerror = () => reject(new Error('network error'));
                xhr.send(file);
            });
            const notifyAdmin = async (trackTitle) => {
                try {
                    const adminSnap = await db.collection('users').where('email','==',ADMIN_EMAIL).limit(1).get();
                    if (!adminSnap.empty) await sendNotification(adminSnap.docs[0].id, {uid:user.uid, username:profile.username, avatar:profile.avatar}, 'music_pending', `${trackTitle}`, {});
                } catch(e){ console.warn('notify admin err', e); }
            };
            const submit = async () => {
                if (!audioFile || !title.trim()) { alert('Введите название и загрузите аудио'); return; }
                if (audioFile.size > 50 * 1024 * 1024) { alert('Файл больше 50 МБ'); return; }
                setUploading(true); setProgress('Подготовка...');
                try {
                    let coverUrl = '';
                    if (coverFile) {
                        setProgress('Загружаем обложку...');
                        const { uploadUrl, key } = await getUploadUrl(coverFile.name, coverFile.type, 'covers');
                        await uploadFileDirect(coverFile, uploadUrl);
                        coverUrl = `https://gopo-music.storage.yandexcloud.net/${key}`;
                    }
                    setProgress('Загружаем аудио...');
                    const { uploadUrl: audioUploadUrl, key: audioKey } = await getUploadUrl(audioFile.name, audioFile.type, 'audio');
                    await uploadFileDirect(audioFile, audioUploadUrl, (p) => setProgress(`Аудио: ${p}%`));
                    const audioUrl = `https://gopo-music.storage.yandexcloud.net/${audioKey}`;
                    await db.collection('tracks').add({ title: title.trim(), artist: artist.trim() || 'Неизвестен', cover: coverUrl, audioUrl, uploadedBy: user.uid, uploaderName: profile.username, status: 'pending', rejectionReason: '', plays: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    await notifyAdmin(title.trim());
                    onClose();
                } catch (e) { console.error('Upload error:', e); alert('Ошибка загрузки: ' + e.message); }
                setUploading(false); setProgress('');
            };
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-black">Загрузить трек</h2><button onClick={onClose} className="p-2 text-slate-400"><I.X/></button></div>
                        <div className="flex flex-col items-center mb-4">
                            <div onClick={()=>coverRef.current.click()} className="w-32 h-32 rounded-2xl bg-slate-100 flex items-center justify-center overflow-hidden cursor-pointer hover:bg-slate-200 transition">
                                {coverPreview ? <img src={coverPreview} className="w-full h-full object-cover" /> : <div className="text-slate-400 text-center"><I.Image/><p className="text-xs font-bold mt-1">Обложка</p></div>}
                            </div>
                            <input ref={coverRef} type="file" accept="image/*" className="hidden" onChange={pickCover} />
                        </div>
                        <label className="text-xs font-bold text-slate-600 ml-1">Название</label>
                        <input value={title} onChange={e=>setTitle(e.target.value)} className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium" placeholder="Название трека" />
                        <label className="text-xs font-bold text-slate-600 ml-1">Исполнитель</label>
                        <input value={artist} onChange={e=>setArtist(e.target.value)} className="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-gopo mb-3 font-medium" placeholder="Исполнитель" />
                        <label className="text-xs font-bold text-slate-600 ml-1">Аудиофайл (до 50 МБ)</label>
                        <div onClick={()=>audioRef.current.click()} className="w-full p-3 bg-slate-50 rounded-xl cursor-pointer mb-4 text-sm font-bold text-slate-600 hover:bg-slate-100">
                            {audioFile ? `✓ ${audioFile.name}` : 'Выбрать MP3 / M4A / OGG'}
                        </div>
                        <input ref={audioRef} type="file" accept="audio/*" className="hidden" onChange={e=>setAudioFile(e.target.files[0])} />
                        {uploading && <p className="text-sm font-bold text-gopo text-center mb-3">{progress || 'Загрузка...'}</p>}
                        <button onClick={submit} disabled={uploading} className="w-full bg-gopo text-white font-bold py-3 rounded-xl disabled:opacity-50">{uploading ? 'Загрузка...' : 'Отправить на проверку'}</button>
                        <p className="text-[10px] text-slate-400 font-bold text-center mt-2">Трек появится в ленте после одобрения админом</p>
                    </div>
                </div>
            );
        };

        const PremiumTab = ({ user, profile }) => {
            return (
                <div className="fade-in max-w-2xl mx-auto">
                    <div className="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 rounded-[2.5rem] p-8 text-white relative overflow-hidden shadow-2xl">
                        <div className="absolute top-0 right-0 opacity-10 text-9xl pointer-events-none" style={{transform: 'translate(20%, -20%)'}}>👑</div>
                        
                        <div className="flex items-center gap-3 mb-2">
                            <span className="bg-purple-500 text-white text-[10px] font-black uppercase px-3 py-1 rounded-full tracking-wider">Beta</span>
                            <h1 className="text-3xl font-black">GoPo Premium</h1>
                        </div>
                        <p className="text-purple-200 font-medium mb-8">Поддержи проект и получи крутые плюшки. Без золотых галочек, только польза.</p>

                        <div className="space-y-4 mb-8">
                            <div className="flex items-center gap-4 bg-white/10 p-4 rounded-2xl backdrop-blur-sm">
                                <div className="text-3xl">💰</div>
                                <div>
                                    <h3 className="font-black text-lg">x2 GoCoin</h3>
                                    <p className="text-xs text-purple-200 font-medium">Все начисления (посты, комменты, сообщения) умножаются на 2.</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4 bg-white/10 p-4 rounded-2xl backdrop-blur-sm">
                                <div className="text-3xl">🎨</div>
                                <div>
                                    <h3 className="font-black text-lg">Эксклюзивный стиль</h3>
                                    <p className="text-xs text-purple-200 font-medium">Доступ к уникальным премиум-рамкам и стилям постов.</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4 bg-white/10 p-4 rounded-2xl backdrop-blur-sm">
                                <div className="text-3xl">🚀</div>
                                <div>
                                    <h3 className="font-black text-lg">Приоритет в ленте</h3>
                                    <p className="text-xs text-purple-200 font-medium">Твои пузыри видит больше людей.</p>
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center justify-between bg-black/40 p-4 rounded-2xl border border-white/10">
                            <div>
                                <p className="text-sm text-purple-300 font-bold">Стоимость</p>
                                <p className="text-3xl font-black">99 ₽ <span className="text-sm text-slate-400 font-medium">/ мес</span></p>
                            </div>
                            <button onClick={() => alert('Оплата пока находится в разработке. Скоро всё будет! 🚀')} className="bg-white text-purple-900 font-black px-6 py-3 rounded-xl hover:bg-purple-50 transition shadow-lg shadow-purple-500/30">
                                Оформить
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ShopTab = ({ user, profile }) => {
            const [filter, setFilter] = useState('all');
            const goCoins = profile.goCoins || 0;
            const owned = profile.ownedCosmetics || [];
            const forSale = SHOP_ITEMS.filter(i => i.season !== 'halloween');
            const filtered = forSale.filter(i => filter === 'all' || i.type === filter);
            const buy = async (item) => {
                if (owned.includes(item.id)) return;
                if (goCoins < item.price) { alert('Недостаточно GoCoin 🪙'); return; }
                if (!window.confirm(`Купить «${item.name}» за ${item.price} 🪙?`)) return;
                try {
                    await db.collection('users').doc(user.uid).update({
                        goCoins: firebase.firestore.FieldValue.increment(-item.price),
                        ownedCosmetics: firebase.firestore.FieldValue.arrayUnion(item.id)
                    });
                } catch (e) { alert('Ошибка: ' + e.message); }
            };
            const equipItem = async (item) => {
                const updates = {};
                if (item.type === 'frame') updates.halloweenFrameId = profile.halloweenFrameId === item.id ? null : item.id;
                if (item.type === 'badge') updates.halloweenBadgeId = profile.halloweenBadgeId === item.id ? null : item.id;
                if (item.type === 'post') updates.halloweenPostStyle = (profile.halloweenPostStyle === item.id) ? null : item.id;
                try { await db.collection('users').doc(user.uid).update(updates); } catch(e) { alert(e.message); }
            };
            return (
                <div className="fade-in">
                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center space-x-2"><I.Cart/><h1 className="text-2xl font-black">Магазин</h1></div>
                        <div className="liquid-glass px-4 py-2 rounded-full flex items-center gap-2">
                            <I.Coin /><span className="font-black text-amber-700">{goCoins}</span>
                        </div>
                    </div>
                    <div className="flex space-x-2 mb-4 flex-wrap gap-y-2">
                        <button onClick={()=>setFilter('all')} className={`px-4 py-2 rounded-xl text-sm font-bold ${filter==='all'?'bg-gopo text-white shadow':'bg-white text-slate-600'}`}>Всё</button>
                        <button onClick={()=>setFilter('frame')} className={`px-4 py-2 rounded-xl text-sm font-bold ${filter==='frame'?'bg-gopo text-white shadow':'bg-white text-slate-600'}`}>Рамки</button>
                        <button onClick={()=>setFilter('badge')} className={`px-4 py-2 rounded-xl text-sm font-bold ${filter==='badge'?'bg-gopo text-white shadow':'bg-white text-slate-600'}`}>Бейджи</button>
                        <button onClick={()=>setFilter('post')} className={`px-4 py-2 rounded-xl text-sm font-bold ${filter==='post'?'bg-gopo text-white shadow':'bg-white text-slate-600'}`}>Стили постов</button>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                        {filtered.map(item => {
                            const has = owned.includes(item.id);
                            const canAfford = goCoins >= item.price;
                            const isEq = (item.type === 'frame' && profile.halloweenFrameId === item.id) || (item.type === 'badge' && profile.halloweenBadgeId === item.id) || (item.type === 'post' && profile.halloweenPostStyle === item.id);
                            return (
                                <div key={item.id} className={`bg-white rounded-2xl p-3 border-2 rarity-${item.rarity} flex flex-col items-center text-center gap-2`}>
                                    <div className="text-4xl">{item.emoji}</div>
                                    <div className="flex-1 min-w-0">
                                        <div className="font-black text-sm line-clamp-2">{item.name}</div>
                                        <div className="text-[10px] text-slate-400 font-bold uppercase mt-1">{RARITY_LABEL[item.rarity]}</div>
                                    </div>
                                    <div className="w-full mt-auto">
                                        <div className={`text-xs font-black mb-1.5 ${canAfford ? 'text-amber-600' : 'text-slate-500'}`}>🪙 {item.price.toLocaleString('ru')}</div>
                                        {has ? <button onClick={()=>equipItem(item)} className={`w-full text-[11px] font-black px-2 py-1.5 rounded-lg ${isEq ? 'bg-slate-700 text-white' : 'bg-gopo text-white'}`}>{isEq ? 'Снять' : 'Надеть'}</button>
                                            : <button onClick={()=>buy(item)} disabled={!canAfford} className="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white text-[11px] font-black px-2 py-1.5 rounded-lg disabled:opacity-40">Купить</button>}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <p className="text-center text-[10px] text-slate-400 font-bold mt-4">Зарабатывай GoCoin: пост +25 · коммент +10 · сообщение +3 · 10 мин онлайн +10</p>
                </div>
            );
        };

        const AdventTab = ({ user, profile }) => {
            const [openingDay, setOpeningDay] = useState(null);
            const [showReward, setShowReward] = useState(null);
            const now = Date.now();
            const opened = profile.adventOpened || [];
            const rewards = profile.adventRewards || {};
            const getTodayDay = () => {
                if (now < ADVENT_START) return 0;
                if (now > ADVENT_END) return 31;
                return Math.min(31, new Date().getDate());
            };
            const todayDay = getTodayDay();
            const getReward = (day) => {
                if (day === 31) return ADVENT_FINAL;
                const seed = `${user.uid}_${day}_gopo_winter`;
                let h = 0;
                for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
                const r = ADVENT_POOL[h % ADVENT_POOL.length];
                if (r.type === 'cosmetic' && (profile.ownedCosmetics || []).includes(r.itemId)) {
                    return { type: 'coins', amount: 150, name: '150 GoCoin (повтор)', emoji: '🪙' };
                }
                return r;
            };
            const openDay = async (day) => {
                if (day > todayDay) return;
                if (opened.includes(day)) return;
                if (openingDay) return;
                setOpeningDay(day);
                const reward = getReward(day);
                try {
                    const updates = {
                        adventOpened: firebase.firestore.FieldValue.arrayUnion(day),
                        [`adventRewards.${day}`]: reward
                    };
                    let coinsToAdd = 0;
                    if (reward.type === 'coins') coinsToAdd += reward.amount;
                    if (reward.bonusCoins) coinsToAdd += reward.bonusCoins;
                    if (coinsToAdd > 0) updates.goCoins = firebase.firestore.FieldValue.increment(coinsToAdd);
                    if (reward.type === 'cosmetic') updates.ownedCosmetics = firebase.firestore.FieldValue.arrayUnion(reward.itemId);
                    await db.collection('users').doc(user.uid).update(updates);
                    setTimeout(() => { setShowReward({ day, ...reward }); setOpeningDay(null); }, 300);
                } catch (e) { alert(e.message); setOpeningDay(null); }
            };
            return (
                <div className="fade-in rounded-3xl p-5 relative overflow-hidden" style={{ background: 'linear-gradient(135deg, #0a1a2f 0%, #1e3a5f 50%, #0a1a2f 100%)' }}>
                    <div className="absolute inset-0 pointer-events-none overflow-hidden">
                        <div className="absolute text-3xl opacity-30" style={{top:'8%', animation:'snowFall 20s linear infinite'}}>❄️</div>
                        <div className="absolute text-2xl opacity-20" style={{top:'55%', animation:'snowFall 26s linear infinite', animationDelay:'-7s'}}>❄️</div>
                    </div>
                    <div className="relative z-10 text-white">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center gap-2"><span className="text-2xl">🎄</span><h1 className="text-2xl font-black">Адвент-календарь</h1></div>
                            <div className="flex items-center gap-2 bg-black/40 rounded-full px-4 py-2 border border-amber-500/40"><I.Coin /><span className="font-black text-amber-300">{profile.goCoins || 0}</span></div>
                        </div>
                        <p className="text-sm text-slate-300 mb-4">Открывай по одному подарку каждый день с 1 по 31 декабря. Что внутри — сюрприз!</p>
                        {now < ADVENT_START && <div className="winter-event-pill mb-4 w-full">⏰ Адвент начнётся 1 декабря</div>}
                        {now > ADVENT_END && <div className="bg-red-500/20 border border-red-500/40 rounded-full px-4 py-2 text-sm font-bold mb-4 text-red-300 text-center">🎄 Адвент завершён</div>}
                        <div className="grid grid-cols-5 sm:grid-cols-6 gap-2">
                            {Array.from({length: ADVENT_DAYS}, (_, i) => i + 1).map(day => {
                                const isOpened = opened.includes(day);
                                const isToday = day === todayDay;
                                const isAvailable = day <= todayDay;
                                const isFinal = day === 31;
                                const locked = !isAvailable;
                                return (
                                    <div key={day}
                                        onClick={() => { if (isAvailable && !isOpened && !openingDay) openDay(day); }}
                                        className={`advent-day ${locked?'locked':''} ${isOpened?'opened':''} ${isToday && !isOpened?'today':''} bg-white/10 border border-white/20 text-white`}>
                                        {isFinal && <div className="absolute -top-2 -right-2 text-lg">👑</div>}
                                        {isOpened ? (
                                            <div className="gift-pop text-2xl">{rewards[day]?.emoji || '🎁'}</div>
                                        ) : (
                                            <div className="text-center">
                                                <div className="text-xl">{openingDay === day ? '✨' : (isFinal ? '🎁' : (locked ? '🔒' : '🎁'))}</div>
                                                <div className={`text-[10px] font-black mt-0.5 ${isFinal ? 'text-amber-300' : ''}`}>{day}</div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                        <p className="text-center text-[10px] text-slate-400 font-bold mt-4">День 31 — особый приз: легендарная косметика + 1000 GoCoin</p>
                    </div>
                    {showReward && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[80] flex items-center justify-center p-4" onClick={()=>setShowReward(null)}>
                            <div className="bg-gradient-to-br from-sky-400 via-blue-500 to-purple-600 rounded-3xl p-8 max-w-sm w-full text-center gift-pop shadow-2xl" onClick={e=>e.stopPropagation()}>
                                <div className="text-7xl mb-3">{showReward.emoji}</div>
                                <h3 className="text-2xl font-black text-white mb-1">День {showReward.day} открыт!</h3>
                                <p className="text-lg font-black text-amber-200 mt-3">{showReward.name}</p>
                                {showReward.type === 'cosmetic' && showReward.bonusCoins && <p className="text-amber-100 font-bold mt-1">+ {showReward.bonusCoins} 🪙</p>}
                                <button onClick={()=>setShowReward(null)} className="mt-5 bg-white text-blue-600 font-black px-6 py-2.5 rounded-xl shadow-md">Забрать</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
