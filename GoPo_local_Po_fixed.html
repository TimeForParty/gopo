@layer base{

}

/* Po */
.po{overflow:visible;display:block;flex-shrink:0}

@keyframes fade{from{opacity:0}to{opacity:1}}

/* posts: speech-bubble corner is the brand shape */
.bubble{border-radius:28px 28px 28px 8px}

.ps-frozen{--card:#102a40;--tx:#e8fbff;--mute:#9fd6e6;--line:#67d4e8;--soft:#173a55}
.ps-halloween{--card:#1d0f24;--tx:#f3e5ff;--mute:#b79ac9;--line:#ff6b00;--soft:#2a1634}
.ps-cursed{--card:#2a0707;--tx:#ffe3e3;--mute:#d49a9a;--line:#dc2626;--soft:#3a0e0e}
.ripple{position:absolute;width:80px;height:80px;border-radius:99px;background:var(--po);opacity:.3;pointer-events:none;animation:ripple .6s ease-out forwards}
@keyframes ripple{from{transform:scale(0);opacity:.4}to{transform:scale(4);opacity:0}}
.poll-bar{position:absolute;inset:0;background:color-mix(in srgb,var(--po) 16%,transparent);transition:width .3s}
.hashtag{color:var(--po);font-weight:700;cursor:pointer}

/* shop rarity */
.r-common{border-color:#94a3b8}.r-rare{border-color:#3b82f6}.r-epic{border-color:#a855f7;box-shadow:0 0 14px rgba(168,85,247,.35)}
.r-legendary{border-color:#f59e0b;box-shadow:0 0 18px rgba(245,158,11,.4)}.r-mythic{border-color:#ef4444;box-shadow:0 0 22px rgba(239,68,68,.45)}

/* advent */
.adv{aspect-ratio:1/1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;position:relative;transition:transform .15s}

.po-orb{width:68px;height:68px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(192,165,255,.34));box-shadow:0 10px 30px rgba(118,82,190,.2),inset 0 1px 0 white}
.po-online{font-size:11px;font-weight:800;color:#239b70;background:rgba(53,190,137,.12);padding:7px 11px;border-radius:99px}
.po-note{background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(18px);color:var(--mute)}
.po-chat-log{scrollbar-width:thin}.po-bot-bubble,.po-user-bubble{max-width:86%;padding:13px 16px;border-radius:24px;font-size:15px;line-height:1.45;box-shadow:0 8px 24px rgba(38,24,75,.08)}
.po-bot-bubble{background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.8);border-bottom-left-radius:9px;backdrop-filter:blur(18px)}
.po-user-bubble{background:linear-gradient(135deg,var(--po),#9b72ee);color:white;border-bottom-right-radius:9px}
.po-suggestion{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.42);padding:9px 13px;border-radius:99px;font-size:12px;font-weight:750;backdrop-filter:blur(16px)}
.po-composer{border-top:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.26);border-radius:0 0 36px 36px;backdrop-filter:blur(24px)}
.po-input{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.62);border-radius:99px;padding:13px 17px;outline:none;color:var(--ink)}
.po-send{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--po),#9d76ed);color:white;box-shadow:0 8px 20px rgba(117,77,191,.28)}.po-send:disabled{opacity:.35}
/* Direct messages: floating glass header, spacious rounded bubbles and pill composer */
.dm-shell{background:radial-gradient(ellipse at 50% 0%,rgba(180,153,255,.12),transparent 55%),transparent}
.dm-topbar{margin:8px 8px 4px;border-radius:28px!important;padding:12px!important}
.dm-message-list{scrollbar-width:thin;scrollbar-color:rgba(150,120,205,.3) transparent}
.dm-bubble{border-radius:27px!important;box-shadow:0 8px 24px rgba(40,24,75,.08),inset 0 1px 0 rgba(255,255,255,.18);line-height:1.48!important}
.dm-message-row{padding:1px 2px}
.dm-composer{margin:8px;border-radius:28px!important;border:1px solid rgba(255,255,255,.68)!important;background:rgba(255,255,255,.5)!important;box-shadow:0 12px 35px rgba(40,24,75,.12)!important;backdrop-filter:blur(30px) saturate(1.8)!important}
.dm-composer input{border:1px solid rgba(255,255,255,.65)!important;background:rgba(255,255,255,.62)!important;border-radius:99px!important;padding-left:17px!important}
@media(prefers-color-scheme:dark){:root{--glass-line:rgba(255,255,255,.16);--glass-shadow:0 18px 55px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12)}.bg-card,.sheet-in,.profile-shell,.po-assistant,.dm-topbar,.dm-composer,.po-assistant-head{background:linear-gradient(145deg,rgba(42,35,59,.78),rgba(30,26,43,.48))!important}.po-bot-bubble{background:rgba(49,42,66,.78);border-color:rgba(255,255,255,.13)}.po-note,.po-suggestion,.dm-composer{background:rgba(49,42,66,.58)!important}.po-input,.dm-composer input{background:rgba(25,21,36,.65)!important;color:var(--ink)}}
@media(prefers-reduced-motion:no-preference){.po-orb{animation:poFloat 4s ease-in-out infinite}@keyframes poFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}}
</style>
<style id="gopo-fix-pack">
html,body{background:var(--bg)!important}
.dm-shell{background:transparent!important}
.bg-card,.sheet-in,.profile-shell,.dm-topbar,.dm-composer{background:var(--card)!important}
.post,.post.bubble{border-radius:42px!important;overflow:visible!important;box-shadow:none!important;position:relative}
.post.bubble .absolute.-top-3{z-index:8;top:-12px;left:22px;white-space:nowrap;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.post.bubble>header{position:relative;z-index:1}
.post img,.post video{border-radius:30px!important}
.po-assistant{height:calc(100dvh - 154px);min-height:420px;max-height:100%;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(231,218,255,.48) 54%,rgba(255,255,255,.34))!important;border:1px solid rgba(255,255,255,.86)!important;box-shadow:0 22px 60px rgba(95,67,145,.18),inset 0 1px 0 rgba(255,255,255,.95)!important}
.po-assistant-head{flex-shrink:0}
.po-chat-log{min-height:0!important;overscroll-behavior:contain}
.po-composer{position:relative;z-index:2;flex-shrink:0!important;min-height:72px;padding-bottom:max(12px,env(safe-area-inset-bottom))!important}
.po-clear{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--mute);background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.75)}
.po-bot-bubble,.po-user-bubble{border-radius:28px!important}
.po-user-bubble{background:linear-gradient(135deg,var(--po),#a45fd2)!important}
.dm-topbar,.dm-composer{background:var(--card)!important;backdrop-filter:none!important}
@media(max-width:640px){.po-assistant{height:calc(100dvh - 170px);min-height:360px;border-radius:28px!important}.po-assistant-head{padding:12px!important}.po-chat-log{padding:12px!important}.po-composer{padding:10px!important}}
@media(prefers-color-scheme:dark){.po-assistant{background:linear-gradient(145deg,rgba(43,36,60,.94),rgba(34,28,49,.9))!important}.po-clear{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}}
</style>
<style id="po-local-ai">
.po-online{font-size:10px;font-weight:800;border-radius:999px;padding:6px 9px;background:rgba(34,197,94,.13);color:#16834a;white-space:nowrap}
.po-retry{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.65);border:1px solid rgba(120,100,150,.16);flex:none}
.po-model-panel{background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.8)}
.po-load-btn{background:var(--po);color:white;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800;white-space:nowrap}
@media(prefers-color-scheme:dark){.po-model-panel{background:rgba(40,34,54,.7);border-color:rgba(255,255,255,.1)}}
</style></head>
